  讲法证据:
    原句摘录: 本学期我们每天学习一道思维题高题，今天学习这道题，我们来看小明想加一个数乘7，却错除以7。
    adapted_script: |
      ## 学情边界（北师大 3下 · 思维拓展）
      - 主题：错中求解（乘除+加减连错）

      ## 讲题脚本
      ### 1. 理信息
      读题：想「加某数×7」却错除以7；想+36却错-36，最后得4。问正确结果。
      ### 2. 找联系
      识别题型：「错中求解——错了两次，仍属错中求解。」
      ### 3. 试第一条路
      列错误算式：□÷7-36=4（按错误顺序）。
      ### 4. 换路
      开火车倒推：4+36=40 → 40×7=280，得原数280。
      ### 5. 第二、第三条路
      再按正确顺序算：280×7+36，竖式对齐位数，得1996。
      ### 6. 归一
      错中求解万能路：错式倒推找原数 → 再按正确顺序算；计算步骤不能省。
      ### 7. 收尾
      验算：280÷7=40，40-36=4。提醒：会做还要算对。
  boundary: ok
