      - 整体÷分母×分子
    讲法证据:
      原句摘录: "有12名学生，其中3分之1是女生，3分之2是男生……省略了12名学生的3分之1是女生。"
      adapted_script: |
        ## 学情边界（北师大 3下 · 六_认识分数）
        - 主题：求整体的几分之几是多少
        - 可用：12÷3=4（女生），4×2=8（男生）；画图平均分成3份
        - 禁用：分数加减通分
        ## 讲题脚本
        ### 1. 理信息
        12名学生，1/3女生、2/3男生；补全省略「12名学生的」。
        ### 2. 找联系
        1/3=平均分成3份取1份；2/3=取2份。先求1份：12÷3。
        ### 3. 试第一条路
        女生：12÷3=4人；男生：4×2=8人；检查4+8=12。
        ### 4. 换路
        涂色题：同一整体平均分5份取3份→5/3；加深分数意义。
        ### 5. 第二、第三条路
        整体÷分母得1份，×分子得所取份数——在图上理解再说。
        ### 6. 归一
        分数先还原成「平均分几份、取几份」，再算每份多少。
        ### 7. 收尾
        易错：不补整体是谁；把1/3当3人。
    boundary: ok
