    题型: [T06]
    方法:
      - 竖式位值
      - 分拆口算

    讲法证据:
      原句摘录: "黑板上这一个数字，他昨天出现了在了我们的事件上，让我们判断它是对还是错。如果错让我们改正，让我大吃一惊的水。"
      adapted_script: |
        ## 学情边界（北师大 3上 · 三_乘法）
        - 主题：两位数×一位数竖式位值纠错
        ## 讲题脚本
        ### 1. 理信息
        43×5竖式错写成35；读题「5×3个一=15，5×4个十=20个十=200」。
        ### 2. 找联系
        问「5×4乘的是4个什么？」→4个十，得20个十写200，不能写20。
        ### 3. 试第一条路
        按位值拆开写：5×3=15，5×4=200，相加215。
        ### 4. 换路
        口算分拆：40×5=200，3×5=15，200+15=215；与竖式简写对照。
        ### 5. 第二、第三条路
        完整竖式：先个位再十位，进位标注；两种改法殊途同归。
        ### 6. 归一
        「本质一样」——一位数分别乘各位，认清位值再相加。
        ### 7. 收尾
        易错：4×5=20写在十位旁（应是200）；每步问「几个十/几个一」。

    boundary: ok
