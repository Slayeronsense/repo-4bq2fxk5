      adapted_script: |
        ## 学情边界（北师大 4下 · 二_认识三角形和四边形 · preview）
        - 主题：错中求解（除法看除数）
        - 适配：删术语/换情境；标注思维拓展
        ## 讲题脚本
        ### 1. 理信息
        把569看成527，商少2、余数相同，求正确商和余数。
        ### 2. 找联系
        写错式527÷□=△…☆与对式569÷□=□…☆；除法改乘法：商×除数+余数=被除数。
        ### 3. 试第一条路
        两式右边差569-527=42；左边仅商×除数部分差42。
        ### 4. 换路
        商少2→少2个除数=42，除数=21；569÷21=27…2。
        ### 5. 第二、第三条路
        与以前错看被除数位数的题对比—— today 关键在「商差→除数差」。
        ### 6. 归一
        「本质一样」——错中求解：双式对照，找唯一变化量。
        ### 7. 收尾
        易错：除数两位数试商；余数相同条件别漏。

    boundary: ok
