    source: douyin
    grade_semester: 1上
    人教来源提示: 内容审查误挂6上·一年级思维拓展一笔画
    对照:
      安全等级: 黄
      适配动作:
      - 标注思维拓展
    题型: [T12]
    方法:
      - 单双数点计数
      - 试连验证
    讲法证据:
      原句摘录: "同学们大家好，我是小太阳老师。今天我们来学习一年级思维题。请看，从小黑点出发，能一笔把这些图描出来吗？"
      adapted_script: |
        ## 学情边界（北师大 1上 · 思维拓展）
        - 主题：一笔画（单数点/双数点）
        - 可用：数从一点出发有几条路；0或2个单数点可一笔画
        - 适配：标注思维拓展；课内不考欧拉公式
        ## 讲题脚本
        ### 1. 理信息
        出示图形，问能否从黑点一笔描完；板书单数点（1/3/5条路）、双数点（2/4条路）。
        ### 2. 找联系
        逐点标记：从这点出发有几条路？奇数还是偶数？
        ### 3. 试第一条路
        学生直接试连；连不通说「这条路行不通」，回来数点。
        ### 4. 换路
        规则：单数点0个或2个→能一笔画；2个单数点须从单数点起或止于单数点。
        ### 5. 第二、第三条路
        对比全双数点图与两个单数点图；示范连法。
        ### 6. 归一
        能不能一笔画，看单数点个数，不靠运气试。
        ### 7. 收尾
        易错：只试不数点。boundary标注later。
    boundary: later
