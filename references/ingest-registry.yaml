      - 拼合

    讲法证据:
      原句摘录: "2块大小相同的绿地如下图所示，大小是相同的。一小问问绿地的面积是多少？同学们，绿地的面积请问绿地有几块2块它的面积你打算怎么求啊，说思路，凌乘一，我打算把绿地合在一起？他想把2块绿地合在一起可不可以可以？哎，名乘以。"
      adapted_script: |
        ## 学情边界（北师大 4下 · 四下综合）
        - 主题：组合图形面积（分合/移路）
        - 适配：删术语/换情境；标注思维拓展
        ## 讲题脚本
        ### 1. 理信息
        两块相同绿地，中间小路宽2米，总宽38米、宽13米，求绿地面积。
        ### 2. 找联系
        问「分开算还是合起来？」→分：求一块长(38-2)÷2=18，18×13×2；合：移小路拼成长方形36×13。
        ### 3. 试第一条路
        分开算：一块18×13=234，两块468（单位按题意）。
        ### 4. 换路
        合起来：38-2=36为拼后长，36×13；对比两种思路结果一致。
        ### 5. 第二、第三条路
        第二问铺砖：大面积÷小面积或逐块铺（四位数除法超纲留作拓展）。
        ### 6. 归一
        「本质一样」——面积看面的大小，转化拼合不改变总面积。
        ### 7. 收尾
        易错：把周长描边法套面积；单位换算（厘米↔米）。

    boundary: ok
