    讲法证据:
      原句摘录: "把一个长方形切成三个相同正方形，周长多4条边；切成长方体变三个正方体，棱长和多16条棱。"
      adapted_script: |
            ## 学情边界（北师大 6上 · 一_长方体和正方体）
            - 主题：切割后棱长总和变化
            
            ## 讲题脚本
            ### 1. 理信息
            画图：原长方体→切成3个相同正方体；已知棱长和多160cm。
            ### 2. 找联系
            回忆平面：长方形切3个正方形，周长多4条边长。
            ### 3. 试第一条路
            立体切分多4×4=16条棱；160÷16=10cm（棱长）。
            ### 4. 换路
            法一：先求三正方体棱长和360，再减160得200。
            ### 5. 第二、第三条路
            法二：长方体长30宽10高10，(30+10+10)×4=200。
            ### 6. 归一
            切开后「多出来的」=新露出的棱；拼回去就减少同样条数。
            ### 7. 收尾
            易错：把「多4条边」和「多16条棱」混为一谈；先画图再列式。
