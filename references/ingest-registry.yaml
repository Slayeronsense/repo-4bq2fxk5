        ### 3. 试第一条路
        平行四边形：2块拼的有4种+4块拼1种=5个（含长方形型）。
        ### 4. 换路
        梯形：按1~6块组合列表，3块4个+4块1个+6块2个…合计9个。
        ### 5. 第二、第三条路
        挨块编号顺序数 vs 表格分类数，交叉检查。
