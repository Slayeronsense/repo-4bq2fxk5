    source: douyin
    grade_semester: 3上
    北师大单元: 五_周长
    人教来源提示: 拼图形周长变化
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T07]
    方法:
      - 描边法
      - 减少边
    讲法证据:
      原句摘录: "今天的学习从这几句话开始，首先看第一句话，七读预备起周图形周长和面积的关系嘛？呃，让同学们判断这句话对还是错，说理由李博涵还是错的，你认为是错的，我我举个例子嗯，很好欢。"
      adapted_script: |
        ## 学情边界（北师大 3上 · 五_周长）
        - 主题：周长与面积关系辨析
        ## 讲题脚本
        ### 1. 理信息
        三句判断：①周长相等→面积一定相等？②正方形周长相等→面积一定相等？③长方形周长相等→面积一定相等？
        ### 2. 找联系
        问「决定图形大小的是周长还是边长？」引导：周长相同可以长宽不同。
        ### 3. 试第一条路
        反例：7×9与10×6周长都是32，面积63≠60→①错（不一定）。
        ### 4. 换路
        正方形：周长÷4=边长唯一→②对；长方形：举两长方形周长同面积不同→③不一定。
        ### 5. 第二、第三条路
        用同一组数据对比三句，列表「图形类型×决定因素×结论」。
        ### 6. 归一
        「本质一样」——读清「一定/不一定」，先找决定形状的关键量（边长/长宽）。
        ### 7. 收尾
        易错：把周长相等直接等同面积相等；审题抓「一定」二字。

    boundary: ok
