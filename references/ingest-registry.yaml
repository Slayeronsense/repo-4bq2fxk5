    file: f:/逐字稿/抖音音频逐字稿转完/7366232857192238362.md
    source: douyin
    grade_semester: 3下
    北师大单元: 五_面积
    人教来源提示: 内容审查误挂6上+误标周长·原题为面积单位换算
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T08]
    方法:
      - 摆一摆
      - 大面积÷小面积
    讲法证据:
      原句摘录: "一个面积是一平方米的正方形，要把它剪成面积是一平方厘米的小正方形，可以减多少个。"
      adapted_script: |
        ## 学情边界（北师大 3下 · 五_面积）
        - 主题：面积单位换算（m²与cm²）
        - 可用：1m=100cm→一排100个×100排=10000；1m²=10000cm²
        - 禁用：周长描边法
        ## 讲题脚本
        ### 1. 理信息
        边长1m正方形里摆边长1cm小正方形；第二问排成一排长多少米。
        ### 2. 找联系
        1m里摆100个1cm→100排→100×100=10000个。
        ### 3. 试第一条路
        摆一摆画图：长100个、宽100个。
        ### 4. 换路
        大面积÷小面积：1m²÷1cm²=10000cm²。
        ### 5. 第二、第三条路
        10000个排一排→10000cm=100m；也可 1×10000 想象连起来。
        ### 6. 归一
        面积单位换算=看大图形里能装几个小图形（或面积相除）。
        ### 7. 收尾
        易错：把1m当成100cm（应为100个1cm）；混淆周长与面积。
    boundary: ok
