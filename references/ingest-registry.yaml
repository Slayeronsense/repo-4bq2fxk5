    人教来源提示: 租船方案·列表法
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T15]
    方法:
      - 列表法
      - 坐满约束
      - 方案比价格
    讲法证据:
      原句摘录: "28人去划船……坐满……列表法三步：列表、检验、写答"
      adapted_script: |
        ## 学情边界（北师大 4上 · 方案设计）
        - 可用：列表枚举、坐满（无余数）、比方案总价
        
        ## 讲题脚本
        ### 1. 理信息
        28人；大船6人50元、小船4人40元；第一问坐满方案，第二问最省钱。
        ### 2. 找联系
        「坐满」=每条船人数刚好，不能空位浪费。
        ### 3. 试第一条路
        列表：从全大船开始，大船数递减，算剩余人数需几条小船，验28人。
        ### 4. 换路
        筛可行方案（2、4、6种）再分别算价：4大1小=240元等。
        ### 5. 第二、第三条路
        对比：全小船未必最便宜——要多坐大船。
        ### 6. 归一
        租船=列表+检验坐满+比价。
        ### 7. 收尾
        易错：没检验总人数；漏写答语。
    boundary: ok
