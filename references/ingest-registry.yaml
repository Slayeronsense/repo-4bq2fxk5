    讲法证据:
      原句摘录: "第一步确定关键点……旋转中心动不动……对应点找到了之后再连线"
      adapted_script: |
        ## 学情边界（北师大 3下 · 二_图形的运动 · 旋转）
        - 可用：顺时针/逆时针、旋转90°、绕点旋转
        - 步骤同平移：定点→移点→连线
        
        ## 讲题脚本
        ### 1. 理信息
        读题：△1绕O顺时针90°，△2绕O逆时针90°；标方向与角度防忘。
        ### 2. 找联系
        与平移相同：**确定关键点（O、A、B）→找对应点→连线**。
        ### 3. 试第一条路
        OA旋转：压住O不动，OA顺时针转90°得A'；夹角即旋转角。
        ### 4. 换路
        OB旋转：B'距O格数与OB相同（旋转前后边长不变）。
        ### 5. 第二、第三条路
        △2逆时针90°；OA不在格线上用三角尺定直角。
        ### 6. 归一
        旋转作图=平移思路+**旋转中心固定+保距**。
        ### 7. 收尾
        易错：旋转中心跟着动；对应点格数变少/变多。
