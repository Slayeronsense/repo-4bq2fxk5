  题型:
  - T07
  方法:
  - 假设法
  - 举反例
  讲法证据:
    原句摘录: 判断下面的三句话。我们先看第一句话，两个平行四边形一定能拼成一个大平行四边形。后判断赞成对的句手，赞成错的句手说理由。
    adapted_script: |
      ## 学情边界（北师大 5上 · 八_多边形的面积）
      - 主题：平行四边形面积性质判断

      ## 讲题脚本
      ### 1. 理信息
      三道判断题，逐句读；要求「赞成对的举手、赞成错的举手，说理由」。
      ### 2. 找联系
      第一句：两个平行四边形拼成大平行四边形——关键在「完全相同」而非面积相等。
      ### 3. 试第一条路
      举反例：底12高1 与 底4高3，面积同但拼不成。等底等高也不行（方向不同）。
      ### 4. 换路
      第二句：「底越大面积越大」——错。举反例后归纳：决定面积要看**底和高两个因素**。
      ### 5. 第二、第三条路
      第三句：底和高都扩2倍，面积扩几倍？列式 (2底)×(2高)=4×底×高 → 扩4倍。用假设法：原底1高1面积1，变后2×2=4。
      ### 6. 归一
      判断题先找反例；面积问题底、高要一起看；假设法是检验倍数关系的捷径。
      ### 7. 收尾
      原话：「这种题特别容易出错……只有完全相同才能拼。」
  boundary: ok
