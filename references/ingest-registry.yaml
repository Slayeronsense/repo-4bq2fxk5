  题型:
  - T13
  方法:
  - "M34-21定观测点三步法"
  讲法证据:
    原句摘录: 我们来看体育馆在科技馆的东面，读到这里，请问谁是观测点？科科技馆是观测点，怎么判断的？我们站在哪个位置看那个位置就叫观测点。
    adapted_script: |
      ## 学情边界（北师大 4上 · 五_方向与位置）
      - 主题：方向与观测点

      ## 讲题脚本
      ### 1. 理信息
      读「体育馆在科技馆的东面」，先问：「我们站在哪儿看？」板书两个地点。
      ### 2. 找联系
      点出观测点规则：「站在哪个位置看，那个位置就是观测点。」
      ### 3. 试第一条路
      学生凭直觉填方向；若混了东西，不急着判错，先画方向标。
      ### 4. 换路
      三步法：①定观测点 ②移方向标 ③看相对方向。先以科技馆为观测点画东面。
      ### 5. 第二、第三条路
      换观测点到体育馆，再问「科技馆在体育馆的哪一面？」对比两次结果。
      ### 6. 归一
      「两个地点没变，观测点变了，方向就相对——东西相对、南北相对。」
      ### 7. 收尾
      提醒：忘了相对关系就回到三步法；相对方向只适用于「两地不变、只换观测点」。
  boundary: ok
