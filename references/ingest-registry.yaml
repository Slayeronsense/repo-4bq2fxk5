    题型: [T01]
    方法:
      - 对折份数
      - 逆推乘法
    讲法证据:
      原句摘录: "对折两次每段10厘米，原长=10×4；对折问题三年级讲过。"
      adapted_script: |
            ## 学情边界（北师大 3上 · 四_除法/测量）
            - 主题：绳子对折求原长
            
            ## 讲题脚本
            ### 1. 理信息
            对折两次，每段10cm；求原来多长。
            ### 2. 找联系
            对折2次→4段；每段×段数=总长。
            ### 3. 试第一条路
            10×4=40厘米。
            ### 4. 换路
            逐次展开：对折1次2段，再对折4段。
            ### 5. 第二、第三条路
            若已知总长求每段→除法。
            ### 6. 归一
            对折n次→2^n段；知段长求总长用乘。
            ### 7. 收尾
            易错：对折次数与段数搞混。
    boundary: ok
