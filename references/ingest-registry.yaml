    北师大单元: 六_除法
    人教来源提示: 括号×19<600估20再调（4上除法估算）
    对照:
      安全等级: 绿
      适配动作:
      []

    题型: [T06]
    方法:
      - 估算法
      - 调大小

    讲法证据:
      原句摘录: "下面的括号里最大能填几有两个题，我准备了。我们先来看第一个题，括号乘19小于600怎么做呀？哎，是不是就是这样，我们来想这里是不是表示多少个，就是几个19相加，要比600小，是不是这个意思，同不同意，那我们就是看600里面最多有多少个。"
      adapted_script: |
        ## 学情边界（北师大 4上 · 六_除法）
        - 主题：括号里最大填几（估算+调大小）
        - 适配：除数两位数未学→先估整十再调
        ## 讲题脚本
        ### 1. 理信息
        （ ）×19<600，求括号里最大整数；读题圈「最大」「整数」。
        ### 2. 找联系
        问「600里最多几个19？」→600÷19；除数两位数未学，改估20。
        ### 3. 试第一条路
        600÷20=30，但19<20，最大不能填30→填29（比30小1）。
        ### 4. 换路
        第二题：69×（ ）<5600，69估70→约填80；验80×69=5520，再试81、82调大小。
        ### 5. 第二、第三条路
        31×19=589仍<600，32×19超600→最大31；归纳「先估再调」两步。
        ### 6. 归一
        「本质一样」——都是「几个乘数相加比总数小」，估整十再微调。
        ### 7. 收尾
        易错：估完不验算、填30忘减1；强调每步检查是否仍小于边界。

    boundary: ok
