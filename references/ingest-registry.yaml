      - 画图
    讲法证据:
      原句摘录: "锯木头问题……锯一次形成几段……锯两次形成几段。"
      adapted_script: |
        ## 学情边界（北师大 4上 · 思维拓展）
        - 可用：操作画图、段数与次数关系
        - 适配：北师大4上无专门植树课，标later借讲法
        
        ## 讲题脚本
        ### 1. 理信息
        锯木头：锯几次得几段？
        ### 2. 找联系
        问「第一次锯完有几段？」——1次→2段。
        ### 3. 试第一条路
        画线段标锯口，数段数。
        ### 4. 换路
        归纳：段数=锯次数+1（两端型）。
