        - 主题：估算够不够（乘除双路径）
        - 可用：196≈200、41≈40；除法路径 200÷5≈40；乘法路径 40×5≈200
        - 禁用：精确计算代替估算；估算写「=」
        ## 讲题脚本
        ### 1. 理信息
        板书：196人、41人/车、5辆车；圈出「估算」「约等于」。
        ### 2. 找联系
        除法：5辆车平均每人坐几人，和41比；乘法：5辆车共坐几人，和196比。
        ### 3. 试第一条路
        除法：196→200，200÷5≈40；心里知道实际<40，仍<41→够。
        ### 4. 换路
        乘法：41→40，40×5≈200；估少了都有200，实际更多→够。
        ### 5. 第二、第三条路
        对比两种估法；强调符号用≈不用=。
        ### 6. 归一
        够不够都是比较两个量；乘除是同一问题的两条路。
        ### 7. 收尾
        易错：不估算；只写一种方法；符号写等号。
    boundary: ok
