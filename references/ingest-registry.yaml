  - id: XTY-DY-7367201667273575692
    file: f:/逐字稿/抖音音频逐字稿转完/7367201667273575692.md
    source: douyin
    grade_semester: 4上
    北师大单元: 三_乘法
    人教来源提示: 跨月求星期几·周期7天
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T13]
    方法:
      - 画日历
      - 数天数
      - 除以7看余数
    讲法证据:
      原句摘录: "2012年2月8日是星期三……3月8日应该是星期几"
      adapted_script: |
        ## 学情边界（北师大 4上 · 年月日应用）
        - 2012闰年2月29天
        
        ## 讲题脚本
        ### 1. 理信息
        2012-2-8周三，求2012-3-8星期几。
        ### 2. 找联系
        数经过天数（含头尾）：29-8+1+8=30天；30÷7=4余2。
        ### 3. 试第一条路
        画日历逐日写（验算用）。
        ### 4. 换路
        周期法：从周三起完整周期，余2→周四。
        ### 5. 第二、第三条路
        改结束日/改起始星期，周期起点跟着变。
        ### 6. 归一
        跨月星期=**数天数→÷7看余数**（画日历是验算）。
