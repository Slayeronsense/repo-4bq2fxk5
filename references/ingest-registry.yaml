        ### 5. 第二、第三条路
        对比「分子都是1」与「同分母」两种比较规则。
        ### 6. 归一
        先保证每份一样大（同分母），再比份数（分子）。
        ### 7. 收尾
        易错：死记口诀不理解；在图上说理由。
