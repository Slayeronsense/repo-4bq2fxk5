      adapted_script: |
            ## 学情边界（北师大 2上 · 一_长度单位）
            - 主题：长度单位知识梳理
            
            ## 讲题脚本
            ### 1. 理信息
            四块：统一单位、认识cm/m、线段、解决问题。
            ### 2. 找联系
            各人一拃一长不一→要统一标准。
