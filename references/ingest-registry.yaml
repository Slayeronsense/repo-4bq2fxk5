  - 同一整体多种分数表达
  讲法证据:
    原句摘录: 同学们，现在我们来讲一下数学书95页练习20的第八题，请看是这样的三个图，问，涂色部分是整个图形的几分之几。
    adapted_script: |
      ## 学情边界（北师大 3下 · 六_认识分数）
      - 主题：分数意义 / 同一整体多种表达

      ## 讲题脚本
      ### 1. 理信息
      读题：「涂色部分是整个图形的几分之几？」圈出「整个图形」「涂色部分」。
      ### 2. 找联系
      问：「没平均分怎么办？」引导割补——把块移一移，让等分变直观。
      ### 3. 试第一条路
      第一图：移块后看成「平均分成4份取2份」→ 4/2。
      ### 4. 换路
      同一图再割补：看成「平均分成2份取1份」→ 1/2。「4/2 和 1/2 大小一样吗？」
      ### 5. 第二、第三条路
      正方形加辅助线：8/2 与 1/4 等价；12/8 与 2/3 等价——同一涂色，分数写法可以不同。
      ### 6. 归一
      定分母看「平均分成几份」，定分子看「涂色占几份」；涂色面积不变，分数值相等。
      ### 7. 收尾
      易错：只盯一种分法；要会割补后再等分。原话：「涂色部分的大小变没有？没有。」
  boundary: ok
