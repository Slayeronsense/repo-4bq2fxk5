      adapted_script: |
            ## 学情边界（北师大 3下 · 七_年月日）
            - 主题：闰年与2月最后一天
            
            ## 讲题脚本
            ### 1. 理信息
            1992年2月最后一天→问出生日期。
            ### 2. 找联系
            平年2月28天，闰年2月29天；最后一天即月末。
            ### 3. 试第一条路
            判闰年：1992÷4整除→闰年→2月29日。
            ### 4. 换路
            记口诀：四年一闰，百年不闰，四百年又闰。
            ### 5. 第二、第三条路
            若平年则答2月28日。
            ### 6. 归一
            先定平闰→再定2月有几天→写最后一天。
            ### 7. 收尾
            易错：没判闰年就写28或29。
