        ## 学情边界（北师大 4下 · 二_认识三角形和四边形）
        - 主题：数平行四边形和梯形
        - 适配：含长方形计入平行四边形；标注思维拓展
        ## 讲题脚本
        ### 1. 理信息
        复合图分6块，数平行四边形、梯形各几个；标①~⑥块。
