    题型: [T20]
    方法:
      - 等量代换
      - 检查运算顺序
    讲法证据:
      原句摘录: "图形代替数字，找两式联系做等量代换；括号没改变顺序就不要乱加。"
      adapted_script: |
            ## 学情边界（北师大 4下 · 三_运算律）
            - 主题：图形/字母代表数的综合算式
            
            ## 讲题脚本
            ### 1. 理信息
            三个分步算式含图形；目标写成一个综合算式。
            ### 2. 找联系
            两式有相同图形→等量代换合并。
            ### 3. 试第一条路
            空心正方形=空心圆÷三角形，代入上一式。
            ### 4. 换路
            再与第三式合并；检查先乘除后加减。
            ### 5. 第二、第三条路
            字母ABCD只是换皮，方法不变。
            ### 6. 归一
            综合算式=找相同量替换；括号只为改变顺序才加。
            ### 7. 收尾
            易错：多余括号；代换后运算顺序错。
    boundary: ok
