    source: douyin
    grade_semester: 1上
    北师大单元: 一_加与减（二）
    人教来源提示: 876加几·20以内进位加法
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T01]
    方法:
      - 凑十法
      - 见几想几
      - 分与合
    讲法证据:
      原句摘录: "今天我们来学习876加几……看到九就想一，看到八就想二，看到七就想三"
      adapted_script: |
        ## 学情边界（北师大 1上 · 进位加法）
        - 可用：20以内加法、凑十、分与合（9和1、8和2、7和3凑十）
        - 禁用：竖式进位规范（2上才系统学）、方程
        
        ## 讲题脚本
        ### 1. 理信息
        板书 8+5、7+6 同一图两种看法（前后 vs 男女生）；问「同一问题为何两个算式都对？」
        ### 2. 找联系
        问「怎么算 8+5？」→ 都要拆成「先凑十再加分」。
        ### 3. 试第一条路
        点子图/小棒：从 5 拿 2 给 8 → 10+3=13；圈一圈把后 2 人圈进前 8 人。
        ### 4. 换路
        算式写法：5分成2和3，先算8+2=10，再算10+3=13。
        ### 5. 第二、第三条路
        7+6 同理；对比 9加几分1、8加几分2、7加几分3——「见几想几」。
        ### 6. 归一
        本质：拆分→凑十→十加几；876 加几方法相同。
        ### 7. 收尾
        口令：见9想1、见8想2、见7想3、见6想4；易错：拆错数导致凑不成十。
    boundary: ok
