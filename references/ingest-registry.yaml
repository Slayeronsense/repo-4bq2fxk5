    file: f:/逐字稿/抖音音频逐字稿转完/7343760222822944026.md
    source: douyin
    grade_semester: 3上
    北师大单元: 三_乘法
    人教来源提示: 人教三上·0乘任何数
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T05]
    方法:
      - 乘法意义
      - 规律归纳
    讲法证据:
      原句摘录: "4乘0666……乘数里都有零……零乘任何数都得0。"
      adapted_script: |
        ## 学情边界（北师大 3上 · 三_乘法）
        - 可用：0×a=0、几个0相加
        - 禁用：与4下混合运算律混讲
        
        ## 讲题脚本
        ### 1. 理信息
        一组含0的乘法算式，发现积都是0。
        ### 2. 找联系
        问「0个4是多少？4个0相加呢？」
        ### 3. 试第一条路
        举例0×100、0×5验证。
        ### 4. 换路
        对比「任何数×0」与「0×任何数」。
        ### 5. 第二、第三条路
        联系加法：0+0+…共100次。
        ### 6. 归一
        0乘任何数=0个相加=0。
        ### 7. 收尾
        别与「任何数加0」规律混淆。
    boundary: ok
