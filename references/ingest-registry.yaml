    file: f:/逐字稿/抖音音频逐字稿转完/7382825171897306405.md
    source: douyin
    grade_semester: 3下
    北师大单元: 五_周长
    人教来源提示: 人教3下·选择题技巧（周长面积/余数/乘积）（prescan误标6上·六上簇）
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T07]
    方法:
      - 排除法
      - 读清题眼
    讲法证据:
      原句摘录: ".这是一道选择题，看清楚题目要求。他问下列描述了，这个词关不关键，而且是非常关键。如果你走来选成正确的了，那多可惜，题目看错了是吧？让我们选错误的是，然后这里有三句话，我们挨着来判断，首先看A这句话他说边长4米的正方形，它的周长和面积相等，对不对？"
      adapted_script: |
        ## 学情边界（北师大 3下 · 综合）
        - 主题：选择题技巧（选「错误的是」）
        - 含：周长≠面积；有余数除法；两位数乘积位数
        ## 讲题脚本
        ### 1. 理信息
        圈「选错误的是」；三选项A周长面积、B余数、C乘积位数。
        ### 2. 找联系
        A：16米与16平方米数同意义不同→周长面积不能比→A必错，确定可走人。
        ### 3. 试第一条路
        B：余数比除数小；△最大=6→被除数=16×7+6=118，验证B对。
        ### 4. 换路
        C：20×30=600三位；99×81=8019四位→「可能三位也可能四位」，C对。
        ### 5. 第二、第三条路
        不确定A时再用排除法验BC；技巧：百分之百确定直接选节约时间。
        ### 6. 归一
        选择题=读清问什么+抓必错项+必要时排除验证。
        ### 7. 收尾
        易错：把「选错的」看成「选对的」；周长面积仅因数相同就比较。
    boundary: ok
