    人教来源提示: 正方体棱长扩倍（3上周长误挂→5下preview）
    对照:
      安全等级: 红
      适配动作:
      - boundary仅参考
      - 标注思维拓展

    题型: [T01]
    方法:
      - 假设法
      - 列表
      - 倍率关系

    讲法证据:
      原句摘录: "一个正方体的棱长扩大到原来的二倍，问，棱长和扩大到原来的几倍，表面积扩大到原来的几倍。"
      adapted_script: |
        ## 学情边界（北师大 5下 · 立体图形 · preview）
        - 主题：棱长扩倍→棱长和/表面积倍率
        - 适配：3上无立体图形；boundary仅参考
        ## 讲题脚本
        ### 1. 理信息
        正方体棱长扩2倍，棱长和、表面积各扩几倍；列表：原来|现在|棱长|棱长和|表面积。
        ### 2. 找联系
        假设法：原棱长设1（越小越好算）→棱长和1×12=12，表面积1×1×6=6。
        ### 3. 试第一条路
        现棱长2→棱长和24（×2），表面积24（×4）；填表观察倍率。
        ### 4. 换路
        类比平面：正方形边长×2→周长×2、面积×4；方法相通。
        ### 5. 第二、第三条路
        长方体、圆柱等延伸仅作拓展提及，不作3上/4下主修要求。
        ### 6. 归一
        「本质一样」——假设小数据列表，看变化前后倍数关系。
        ### 7. 收尾
        易错：表面积倍率当成×2（应是×4）；本条仅参考不超纲使用。

    boundary: 仅参考
