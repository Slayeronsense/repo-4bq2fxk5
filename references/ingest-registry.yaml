    北师大单元: 三_乘法
    人教来源提示: 积的变化规律·△×○符号题
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T05]
    方法:
      - 积的变化规律
      - 转化拆分
      - 假设法
    讲法证据:
      原句摘录: "三角形乘圆等于600……两个因数都变了，你能不能转化一下，变成我讲过的"
      adapted_script: |
        ## 学情边界（北师大 4上 · 三_乘法 · 积的变化规律）
        - △、○ 是**乘法符号名**，非几何三角形
        - 可用：一因数不变积随另一因数乘除、两因数同变先拆后看、假设简单数
        
        ## 讲题脚本
        ### 1. 理信息
        板书 △×○=600；分四问：△÷10、○×10、两因数同÷10、一÷10一×10。
        ### 2. 找联系
        问「一个因数不变，另一个÷10，积怎样？」→ 积也÷10（600→60）。
        ### 3. 试第一条路
        单变题：直接套「因数÷10积÷10、因数×10积×10」。
        ### 4. 换路
        **两因数都变**：先看一个不变（△÷10得60），再看第二个（○÷10得6）——转化成熟题。
        ### 5. 第二、第三条路
        假设法：设△=30、○=20（积600且好算），代入变化验算；与规律法对比。
        ### 6. 归一
        一因数变→直接跟；两因数变→拆分转化；假设法是备选路。
        ### 7. 收尾
        易错：把△当几何图形；两因数同变硬套单变口诀。
    boundary: ok
