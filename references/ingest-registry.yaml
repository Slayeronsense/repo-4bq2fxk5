    讲法证据:
      原句摘录: "把十张长5厘米，宽3厘米的长方形纸按照下图所示的方法进行摆放，问这个图形的周长和面积分别是多少？这里要求图形的周长和面积。"
      adapted_script: |
        ## 学情边界（北师大 3上 · 五_周长）
        - 主题：台阶形拼放（周长平移/面积数块）
        ## 讲题脚本
        ### 1. 理信息
        10张5×3长方形台阶摆放，求周长与面积；先分清「一周长度」与「面的大小」。
        ### 2. 找联系
        问「不规则→规则，怎么变？」引导平移：横边往上、竖边往左右拼成大长方形。
        ### 3. 试第一条路
        周长：大长方形长=5×4=20，宽=3×4=12，(20+12)×2=64厘米。
        ### 4. 换路
        面积：不能20×12（算的是外框）；应数10块，5×3×10=150平方厘米。
        ### 5. 第二、第三条路
        对比「周长平移」与「面积数小长方形」两种思路，强调所求不同算法不同。
        ### 6. 归一
        「本质一样」——转化思想：周长看外圈平移，面积看组成块数。
        ### 7. 收尾
        易错：面积用外包长方形长宽相乘；周长/面积单位与含义分清楚。

