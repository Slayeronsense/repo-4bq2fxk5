    source: douyin
    grade_semester: 4上
    北师大单元: 一_认识更大的数
    人教来源提示: 人教四上·用数字组数
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T03]
    方法:
      - 数位
      - 枚举
    讲法证据:
      原句摘录: "347组成最大的五位数、最小的五位数。"
      adapted_script: |
        ## 学情边界（北师大 4上 · 一_认识更大的数）
        - 可用：高位放最大/最小、0不能在最高位
        - 禁用：排列组合公式
        
        ## 讲题脚本
        ### 1. 理信息
        用3、4、7组五位数，求最大最小。
        ### 2. 找联系
        问「五位需要几个数字？缺的位置怎么办？」
        ### 3. 试第一条路
        最大：高位依次放7、4、3，缺位补0。
        ### 4. 换路
        最小：高位放3，0放次高位（非首位）。
        ### 5. 第二、第三条路
        有序枚举验证。
        ### 6. 归一
        组最大数=高位优先大；组最小数=高位优先小且0不当头。
        ### 7. 收尾
        0不能放在最高位。
    boundary: ok
