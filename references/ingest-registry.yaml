      adapted_script: |
            ## 学情边界（北师大 3上 · 四_除法）
            - 主题：有余数除法·进一法
            
            ## 讲题脚本
            ### 1. 理信息
            302人，每3人一份→看302里有几个3。
            ### 2. 找联系
            平均分→除法；有余数看题意要不要「再加一份」。
