    file: f:/逐字稿/抖音音频逐字稿转完/7040405117459270915.md
    source: douyin
    grade_semester: 1上
    北师大单元: 七_加与减（二）
    人教来源提示: 内容审查误挂6上·原题为9加几凑十法新课
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T05]
    方法:
      - 凑十法
      - 接着数
    讲法证据:
      原句摘录: "同学们好，我是小太阳老师。今天我们学了9加几，现在来跟着老师一起回忆一下。"
      adapted_script: |
        ## 学情边界（北师大 1上 · 七_加与减（二））
        - 主题：9加几（20以内进位加法）
        - 可用：凑十法（把加数分成1和几）、接着数、10加几口算
        - 禁用：竖式进位、方程
        ## 讲题脚本
        ### 1. 理信息
        情境：盒内9盒+盒外4盒，问一共多少盒。板书 9+4，圈出「要凑成10」。
        ### 2. 找联系
        问：「9还差几就满10？那4可以怎么分？」——引导 9+1=10，剩下3。
        ### 3. 试第一条路
        接着数：从9往后数4个→13；让学生口述。
        ### 4. 换路
        凑十法：把4盒移1盒进盒内→10+3=13；旁写「4分成1和3，先算9+1=10，再算10+3=13」。
        ### 5. 第二、第三条路
        练习 9+5、9+7：都问「为什么要分成1和几？」对比只有10加几能直接口算。
        ### 6. 归一
        「本质一样」——都是找10：没有10就先凑10，再十加几。
        ### 7. 收尾
        易错：把4随便拆成2+2；强调「凑十必须拆出1和9配对」。
    boundary: ok
