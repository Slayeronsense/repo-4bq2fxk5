    source: douyin
    grade_semester: 5下
    北师大单元: 一_分数
    人教来源提示: 内容审查误挂6上·原题为约分逆推求原分数
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T01]
    方法:
      - 约分逆推
      - 连续除法还原
    讲法证据:
      原句摘录: "一个分数用二约分两次，用三约分一次，用5约分一次，最后得5分之4。问原分数是多少？"
      adapted_script: |
        ## 学情边界（北师大 5下 · 分数）
        - 主题：约分逆推（求原分数）
        - 可用：分子分母同除以同数；连续除=除以乘积（2×2×3×5=60）
        - 禁用：质因数分解术语堆砌
        ## 讲题脚本
        ### 1. 理信息
        复习约分：10/8→5/4，分子分母同除以2，大小不变。
        ### 2. 找联系
        逆推：原分数 ÷2 ÷2 ÷3 ÷5 = 4/5；合并为 ÷60。
        ### 3. 试第一条路
        分子：4×60=240；分母：5×60=300→原分数 240/300。
        ### 4. 换路
        分步画箭头：每约一次分子分母各除一次。
        ### 5. 第二、第三条路
        验算：240/300 再约分能否得 4/5。
        ### 6. 归一
        约分是同时缩小；逆推是同时放大相同倍数。
        ### 7. 收尾
        易错：只乘分子不乘分母。
    boundary: ok
