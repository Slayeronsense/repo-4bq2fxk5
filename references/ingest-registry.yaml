    source: douyin
    grade_semester: 2上
    北师大单元: 一_100以内数的认识
    人教来源提示: 人教二上·两位数表示
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T03]
    方法:
      - 数位
      - 10位+个位
    讲法证据:
      原句摘录: "个位是A，十位是B，这个两位数是多少？"
      adapted_script: |
        ## 学情边界（北师大 2上）
        - 可用：十位×10+个位
        - 禁用：字母代数
        
        ## 讲题脚本
        ### 1. 理信息
        个位A十位B，求两位数。
        ### 2. 找联系
        问「B在十位表示几个十？」
        ### 3. 试第一条路
        B×10+A。
        ### 4. 换路
        计数器或位值表摆数。
        ### 5. 第二、第三条路
        交换A、B对比数值变化。
        ### 6. 归一
        两位数=十位几个十+个位几个一。
        ### 7. 收尾
        别把BA当成AB。
    boundary: ok
  - id: XTY-DY-7307889359070498098
    file: f:/逐字稿/抖音音频逐字稿转完/7307889359070498098.md
    source: douyin
    grade_semester: 4上
    人教来源提示: 人教四上·分糖果余数
    对照:
      安全等级: 黄
      适配动作:
      - 标注思维拓展
    题型: [T09]
    方法:
      - 列表
      - 假设
    讲法证据:
      原句摘录: "分糖果……每人分6颗就剩5颗……"
      adapted_script: |
        ## 学情边界（北师大 4上 · 拓展）
        - 可用：列表试算
        - 适配：盈亏结构，不教公式
        
        ## 讲题脚本
        ### 1. 理信息
        两种分法差若干，求糖果总数或人数。
        ### 2. 找联系
        问「两种分法，每人差几颗？总数差多少？」
        ### 3. 试第一条路
        列表：人数从少到多试。
        ### 4. 换路
        画两种分法的对比条形图。
        ### 5. 第二、第三条路
        找两种分法同一不变量（总糖数）。
        ### 6. 归一
        盈亏=两种分法对比找关系。
        ### 7. 收尾
        标later：公式化留拓展。
    boundary: later
