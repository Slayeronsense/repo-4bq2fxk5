version: "1.0"
source: 北师大四下(老版)_人教版课时对照与备课要点.md
北师大册: 4下
说明: 老版北师大四下（小数意义加减→小数乘法→观察物体→认识方程→统计）；勿与新版四下混用

# 人教关键词 → 北师大映射（用于文件名/标题匹配）
keyword_rules:
  # ── 第一单元：小数的意义和加减法（附录✅安全）──
  - keywords: ["四下第四单元", "小数的意义和性质", "小数的意义", "十进分数", "分数与小数"]
    人教来源: 四下-小数的意义和性质
    北师大适用册: 4下
    北师大单元: 一_小数的意义和加减法
    北师大课时: [01_小数的意义一, 02_小数的意义二, 03_小数的意义三]
    安全等级: 绿
    适配动作: [补充元角分情境, 筛掉化简小数题至意义三之后]

  - keywords: ["小数的大小比较", "比大小", "整数部分相同", "数轴"]
    人教来源: 四下-小数的性质和大小比较
    北师大适用册: 4下
    北师大单元: 一_小数的意义和加减法
    北师大课时: [04_比大小]
    安全等级: 绿
    适配动作: [引入时加数轴直观]

  - keywords: ["四下第六单元", "小数加减", "小数的加法和减法", "买菜", "比身高", "歌手大赛", "小数点对齐"]
    人教来源: 四下-小数的加法和减法
    北师大适用册: 4下
    北师大单元: 一_小数的意义和加减法
    北师大课时: [05_买菜, 06_比身高, 07_歌手大赛]
    安全等级: 绿
    适配动作: [情境可互换购书买菜, 筛掉简便运算题或后置至手拉手, 保留元角分算理解释]

  - keywords: ["小数加减混合", "运算顺序", "整数运算律推广到小数"]
    人教来源: 四下-小数加减混合运算
    北师大适用册: 4下
    北师大单元: 一_小数的意义和加减法
    北师大课时: [07_歌手大赛]
    安全等级: 绿
    适配动作: [仅保留混合运算, 筛掉简便运算题]

  # ── 第二单元：认识三角形和四边形（附录⚠️可用注意平行）──
  - keywords: ["图形分类", "四边形分类", "按边分类", "按角分类"]
    人教来源: 四上-平行四边形和梯形
    北师大适用册: 4下
    北师大单元: 二_认识三角形和四边形
    北师大课时: [01_图形的分类]
    安全等级: 黄
    适配动作: [删涉平行术语题, 改用边相等角直角直观分类]

  - keywords: ["三角形分类", "锐角三角形", "钝角三角形", "等腰三角形", "双名称"]
    人教来源: 四下-三角形
    北师大适用册: 4下
    北师大单元: 二_认识三角形和四边形
    北师大课时: [02_三角形的分类]
    安全等级: 绿
    适配动作: [整合为一次分类活动, 保留同一三角形两个名字]

  - keywords: ["三角形内角和", "180度", "剪拼验证"]
    人教来源: 四下-三角形的内角和
    北师大适用册: 4下
    北师大单元: 二_认识三角形和四边形
    北师大课时: [03_三角形的内角和]
    安全等级: 绿
    适配动作: [删几何证明语言, 保留操作验证]

  - keywords: ["三角形三边关系", "两边之和大于第三边", "摆小棒", "能围成三角形"]
    人教来源: 四下-三角形三边关系
    北师大适用册: 4下
    北师大单元: 二_认识三角形和四边形
    北师大课时: [04_三角形边的关系]
    安全等级: 绿
    适配动作: [补充操作活动题, 不要只做判断题]

  - keywords: ["平行四边形", "梯形", "对边平行", "四边形分类"]
    人教来源: 四上-平行四边形和梯形
    北师大适用册: 4下
    北师大单元: 二_认识三角形和四边形
    北师大课时: [05_四边形的分类]
    安全等级: 黄
    适配动作: [确认平行概念已唤醒, 四上线与角学过]

  # ── 第三单元：小数乘法（附录⚠️谨慎借用）──
  - keywords: ["小数点搬家", "小数点移动", "扩大10倍", "缩小到1/10", "扩大到原来的10倍"]
    人教来源: 四下-小数点移动引起小数大小的变化
    北师大适用册: 4下
    北师大单元: 三_小数乘法
    北师大课时: [02_小数点搬家]
    安全等级: 绿
    适配动作: [语言习惯略异可直接用, 同年级同内容]

  - keywords: ["买文具", "小数乘整数", "3×0.2"]
    人教来源: 五上-小数乘法
    北师大适用册: 4下
    北师大单元: 三_小数乘法
    北师大课时: [01_买文具]
    安全等级: 红
    适配动作: [大幅降级, 保留0.2×4等简单题, 筛掉2.35×3等复杂竖式, 加面积模型元角分直观]

  - keywords: ["街心广场", "积的小数位数", "乘数小数位数之和", "小数乘小数"]
    人教来源: 五上-小数乘小数
    北师大适用册: 4下
    北师大单元: 三_小数乘法
    北师大课时: [03_街心广场]
    安全等级: 红
    适配动作: [删竖式计算题, 保留规律探索题, 用面积模型]

  - keywords: ["包装", "小数乘法竖式", "转化整数乘法", "定小数点"]
    人教来源: 五上-小数乘法竖式
    北师大适用册: 4下
    北师大单元: 三_小数乘法
    北师大课时: [04_包装]
    安全等级: 红
    适配动作: [降级竖式难度, 保留2.6×0.8, 筛复杂进位, 去0可淡处理]

  - keywords: ["蚕丝", "积与乘数大小", "积比乘数大", "积比乘数小"]
    人教来源: 五上-积与因数的大小关系
    北师大适用册: 4下
    北师大单元: 三_小数乘法
    北师大课时: [05_蚕丝]
    安全等级: 红
    适配动作: [筛掉字母表述题, 用具体数字发现规律]

  - keywords: ["手拉手", "乘法分配律", "小数简便运算", "运算律推广"]
    人教来源: 五上-整数乘法运算定律推广到小数
    北师大适用册: 4下
    北师大单元: 三_小数乘法
    北师大课时: [06_手拉手]
    安全等级: 红
    适配动作: [筛掉凑整拆数技巧题, 保留判断哪种算法更简便的体验题]

  # ── 第四单元：观察物体（附录✅完全对应）──
  - keywords: ["观察物体二", "观察物体", "三视图", "正面上面左面", "侧面"]
    人教来源: 四下-观察物体二
    北师大适用册: 4下
    北师大单元: 四_观察物体
    北师大课时: [01_看一看]
    安全等级: 绿
    适配动作: [术语侧面↔左面右面可互换]

  - keywords: ["我说你搭", "根据指令搭积木"]
    人教来源: 四下-观察物体二
    北师大适用册: 4下
    北师大单元: 四_观察物体
    北师大课时: [02_我说你搭]
    安全等级: 绿
    适配动作: [扩展为完整课时40分钟]

  - keywords: ["搭一搭", "根据视图还原", "三视图还原立体图形"]
    人教来源: 四下-观察物体二
    北师大适用册: 4下
    北师大单元: 四_观察物体
    北师大课时: [03_搭一搭]
    安全等级: 绿
    适配动作: []

  # ── 第五单元：认识方程（附录⚠️谨慎借用）──
  - keywords: ["字母表示数", "青蛙儿歌", "用字母表示数"]
    人教来源: 五上-简易方程
    北师大适用册: 4下
    北师大单元: 五_认识方程
    北师大课时: [01_字母表示数]
    安全等级: 红
    适配动作: [筛掉公式定律题, 保留年龄差儿歌类情境题]

  - keywords: ["等量关系", "跷跷板", "天平"]
    人教来源: 五上-方程意义前置
    北师大适用册: 4下
    北师大单元: 五_认识方程
    北师大课时: [02_等量关系]
    安全等级: 红
    适配动作: [人教无独立课时, 优先用北师大跷跷板身高情境]

  - keywords: ["方程的意义", "含有未知数的等式"]
    人教来源: 五上-方程的意义
    北师大适用册: 4下
    北师大单元: 五_认识方程
    北师大课时: [03_方程]
    安全等级: 红
    适配动作: [补充生活情境, 不要纯天平抽象]

  - keywords: ["等式性质", "解方程", "两边同加减", "两边同乘除"]
    人教来源: 五上-等式的性质
    北师大适用册: 4下
    北师大单元: 五_认识方程
    北师大课时: [04_解方程一, 05_解方程二]
    安全等级: 红
    适配动作: [可借天平图示, 格式勿严苛, 筛复杂系数题, 控制x+5=12_4x=24难度]

  - keywords: ["猜数游戏", "倒推", "开火车"]
    人教来源: 五上-简易方程复习
    北师大适用册: 4下
    北师大单元: 五_认识方程
    北师大课时: [06_猜数游戏, 07_练习五]
    安全等级: 红
    适配动作: [难度降级, 筛分数小数系数, 筛多步应用题, 一个未知数]

  # ── 第六单元：数据的表示和分析（附录⚠️跨册整合）──
  - keywords: ["条形统计图", "生日", "1格表示1", "1格表示2", "统计表"]
    人教来源: 四上-条形统计图
    北师大适用册: 4下
    北师大单元: 六_数据的表示和分析
    北师大课时: [01_生日]
    安全等级: 黄
    适配动作: [升级单位量1格表示5或10, 或作复习引入]

  - keywords: ["栽蒜苗", "1格表示5", "1格表示10", "选单位量"]
    人教来源: 四上-条形统计图
    北师大适用册: 4下
    北师大单元: 六_数据的表示和分析
    北师大课时: [02_栽蒜苗一]
    安全等级: 黄
    适配动作: [确保有选单位量决策环节, 不要直接给单位量]

  - keywords: ["折线统计图", "变化趋势", "上升下降", "栽蒜苗二"]
    人教来源: 五下-折线统计图
    北师大适用册: 4下
    北师大单元: 六_数据的表示和分析
    北师大课时: [03_栽蒜苗二]
    安全等级: 黄
    适配动作: [降级情境复杂度, 趋势描述为主预测为辅]

  - keywords: ["平均数", "移多补少", "总数量÷总份数"]
    人教来源: 四下-平均数与条形统计图
    北师大适用册: 4下
    北师大单元: 六_数据的表示和分析
    北师大课时: [04_平均数]
    安全等级: 绿
    适配动作: [前面加画图操作环节]

# 人教年级错位规则（关键）
grade_shift_rules:
