    北师大单元: 三_小数乘法
    错位类型: 年级前移
    安全等级: 红
    适配动作: [降级竖式难度, 删技巧题, 保留规律探索, 加画图估算]

  - 人教来源: 五上-简易方程
    人教册: 5上
    北师大适用册: 4下
    北师大单元: 五_认识方程
    错位类型: 年级前移
    安全等级: 红
    适配动作: [一个未知数, 筛二元联立, 筛小数分数系数, 筛复杂应用题, 格式勿严苛]

  - 人教来源: 四上-条形统计图
    人教册: 4上
    北师大适用册: 4下
    北师大单元: 六_数据的表示和分析
    错位类型: 跨册后移
    安全等级: 黄
    适配动作: [升级单位量, 作复习引入]

  - 人教来源: 五下-折线统计图
    人教册: 5下
    北师大适用册: 4下
    北师大单元: 六_数据的表示和分析
    错位类型: 年级后移
    安全等级: 黄
    适配动作: [降级情境, 趋势描述为主]

  - 人教来源: 四上-平行四边形和梯形
    人教册: 4上
    北师大适用册: 4下
    北师大单元: 二_认识三角形和四边形
    错位类型: 顺序分裂
    安全等级: 黄
    适配动作: [图形分类第一课删平行术语, 四边形分类需唤醒平行概念]

  - 人教来源: 四下-小数的意义和性质
    人教册: 4下
    北师大适用册: 4下
    北师大单元: 一_小数的意义和加减法
    错位类型: 单元顺序差异
    安全等级: 绿
    适配动作: [与人教第六单元加减法跨单元整合, 运算律题后置]

  - 人教来源: 四下-总复习
    人教册: 4下
    北师大适用册: 4下
    北师大单元: 总复习
    错位类型: 范围差异
    安全等级: 红
    适配动作: [勿整卷照搬, 人教缺小数乘法方程折线, 人教多图形运动运算定律, 按六大板块分别找题]

# 北师大 12 册粗规则（manifest 统一在 references/manifests/）
coarse_rules:
  1上:
    默认安全等级: 绿
    manifest: manifests/manifest-keep-1shang.txt
    备注: 语料极少; 多为低年级引用

  1下:
    默认安全等级: 绿
    manifest: manifests/manifest-keep-1xia.txt

  2上:
    默认安全等级: 绿
    manifest: manifests/manifest-keep-2shang.txt

  2下:
    默认安全等级: 绿
    manifest: manifests/manifest-keep-2xia.txt
    备注: 乘法意义引用类

  3上:
    默认安全等级: 绿
    manifest: manifests/manifest-keep-3shang.txt

  3下:
    人教对应度: 高
    默认安全等级: 绿
    manifest: manifests/manifest-keep-3xia.txt
    boundary: 课时知识点边界分析/3下
    可用概要: [一位数乘除, 面积, 方向, 搭配, 分数初步, 数据的整理]
    禁用概要: [方程, 小数乘除, 公顷, 复杂分数运算]

  4上:
    人教对应度: 高
    默认安全等级: 绿
    manifest: manifests/manifest-keep-4shang.txt
    boundary: 课时知识点边界分析/4上
    可用概要: [大数, 运算律, 三位÷两位, 公顷, 线与角, 路程速度]
    禁用概要: [方程, 小数运算, 平行四边形面积公式]

  4下:
    默认安全等级: 按单元
    manifest: manifests/manifest-keep-4xia.txt
    boundary: 课时知识点边界分析/4下
    备注: 详见 keyword_rules + grade_shift_rules

  5上:
    人教对应度: 中
    默认安全等级: 黄
    manifest: manifests/manifest-keep-5shang.txt
    可用概要: [小数除法, 多边形面积, 因数倍数, 植树, 分段计费]
    禁用概要: 对4下学生默认later

  5下:
    默认安全等级: 黄
    manifest: manifests/manifest-keep-5xia.txt

  6上:
    默认安全等级: 黄
    manifest: manifests/manifest-keep-6shang.txt

  6下:
    默认安全等级: 黄
    manifest: manifests/manifest-keep-6xia.txt

# 附录快速检索表映射（6单元汇总）
appendix_units:
  - 北师大单元: 一_小数的意义和加减法
    人教位置: 人教四下第四单元+第六单元
