# 安全等级定义
safety_levels:
  绿: 讲法可直接用; 与人教同年级内容对应, 仅需情境/术语微调
  黄: 需适配; 跨册或顺序差异, 需删术语/降级/换情境/升级单位量
  红: 必须适配或仅参考; 人教在高一学段, 难度默认高一级, 禁止照搬
