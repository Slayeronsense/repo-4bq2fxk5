  人教来源提示: 内容审查→5下（装箱切割·知识树校正）
  对照:
    安全等级: 绿
    适配动作: []
  题型:
  - T07
  方法:
  - 切割摆放
  - 整除验算
  讲法证据:
    原句摘录: 包装工人要将若干个长宽均为15厘米，高为10厘米的长方体化妆品盒装进长为40厘米，宽和高均为30厘米的长方体包装箱里面。
    adapted_script: |
      ## 学情边界（北师大 5下 · 六_长方体的认识）
      - 主题：长方体装箱 / 切割摆放

      ## 讲题脚本
      ### 1. 理信息
      小盒15×15×10装入大箱40×30×30，求最多装几个。
      ### 2. 找联系
      转化为：大长方体能切成多少个小长方体；与装小正方体同一思路。
      ### 3. 试第一条路
      不旋转：40÷15 一行2个余10，有浪费 → 装不满最多。
      ### 4. 换路
      旋转小盒：让10cm边对齐40cm → 一行4个；30÷15=2行；30÷15=2层 → 4×2×2=16。
      ### 5. 第二、第三条路
      对比：要保证最多，长宽高应是大盒的整倍数，避免余数浪费。
      ### 6. 归一
      数「一行几个×几行×几层」；必要时旋转摆放；整除决定能否装最多。
      ### 7. 收尾
      原话：「要保证装最多，就要让长宽高尽可能成整倍数。」
  boundary: ok
