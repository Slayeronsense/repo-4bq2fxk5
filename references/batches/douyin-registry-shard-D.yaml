  讲法证据:
    原句摘录: 同学们好，我是小太阳老师。今天我们学了9加几，现在来跟着老师一起回忆一下。首先我们复习了，下面的算是。
    adapted_script: |
      ## 学情边界（北师大 1上 · 20以内加法）
      - 主题：9加几 / 凑十法

      ## 讲题脚本
      ### 1. 理信息
      情境：盒内9盒、盒外4盒，问一共多少盒。列式 9+4。
      ### 2. 找联系
      复习：十加几等于十几；没有10怎么办？「十真是我们的好朋友。」
      ### 3. 试第一条路
      接着数：从9往后数4个 → 13。
      ### 4. 换路
      凑十法：把盒外1盒放进盒内，盒内10盒、盒外3盒 → 10+3=13。
      ### 5. 第二、第三条路
      把4分成1和3：先算9+1=10，再算10+3=13。追问：「为什么分成1和3？」（9和1凑十）
      ### 6. 归一
      凑十核心：先凑成10，再加剩下的。小棒/花图演示「拿一个过去圈起来」。
      ### 7. 收尾
      布置：用凑十法向家长讲 9+5、9+7。易错：没先凑十就算个位。
  boundary: ok
