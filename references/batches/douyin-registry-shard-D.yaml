  source: douyin
  grade_semester: 3上
  北师大单元: 五_周长
  人教来源提示: 拼图形周长变化
  对照:
    安全等级: 绿
    适配动作: []
  题型:
  - T07
  方法:
  - 描边法
  - 减少边
  讲法证据:
    原句摘录: 甲和乙的周长，这是个长方形，被中间这条线分成了两部分，这边是甲，这边是乙。请问甲和乙的周长谁更大？
    adapted_script: |
      ## 学情边界（北师大 3上 · 五_周长）
      - 主题：不规则分割图形的周长比较

      ## 讲题脚本
      ### 1. 理信息
      长方形被中间曲线分成甲、乙两部分，问周长谁更长。
      ### 2. 找联系
      周长是一周的长度——从起点绕一圈回到起点，描出甲、乙各自边界。
      ### 3. 试第一条路
      第一图：甲、乙都含一条宽+一条弯曲线，中间公共边不算 → 周长相等（眼睛会骗人）。
      ### 4. 换路
      变式：弯曲线位置改变，写出甲=宽+弯+①+②，乙=宽+弯+③+④，比③+④与①+②。
      ### 5. 第二、第三条路
      不能凭「看起来大」判断；必须完整描边再比较。
      ### 6. 归一
      先描一周、再拆分比较；曲线公共段抵消，多出部分决定谁更长。
      ### 7. 收尾
      原话：「数学一点点区别，就会很大程度上影响结果。」
  boundary: ok
