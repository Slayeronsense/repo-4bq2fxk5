    原句摘录: 我们今天的学习就从这一道题开始。嗯，这有一个算式三角形乘43等于五角星乘54。现在请同学们来比较三角形和五角星谁大谁小王一博，你觉得我觉得这三角形呢？嗯选坐有不一样的吗？有没有不一样的？形大新形大那就是三角形少。
    adapted_script: |
      ## 学情边界（北师大 4上 · 三_乘法）
      - 主题：未知数大小比较（乘法意义）

      ## 讲题脚本
      ### 1. 理信息
      板书：△×43=☆×54，问△和☆谁大谁小。
      ### 2. 找联系
      用乘法意义：43个△=54个☆，个数多的一边每个更小 → △更大。
      ### 3. 试第一条路
      化小看：4个△=5个☆，谁大一眼看出。
      ### 4. 换路
      画线段图：43段与54段等长，段数多的每段更短。
      ### 5. 第二、第三条路
      假设法：设△=54、☆=43，交换后积相等；排除0（两边都得0）时△>☆或相等两种可能。
      ### 6. 归一
      积相等时，乘数大的那个因数反而小；会化简、会画图、会假设。
      ### 7. 收尾
      原话：「假设法挺简单，要学会。」题目若限定「不一样大」才选△大。
  boundary: ok
