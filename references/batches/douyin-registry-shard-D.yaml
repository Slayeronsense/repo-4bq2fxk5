  人教来源提示: 4下·小数混合简便运算（知识树校正）
  对照:
    安全等级: 绿
    适配动作: []
  题型:
  - T05
  方法:
  - 提取公因数
  - 运算律
  讲法证据:
    原句摘录: 这学期咱们的试卷里面肯定会出现一种类型的题，它叫能简算的，要简算。那不能简算的就不简算。
    adapted_script: |
      ## 学情边界（北师大 4下 · 一_小数的意义和加减法）
      - 主题：小数混合运算 / 提取公因数

      ## 讲题脚本
      ### 1. 理信息
      两式：3.9-3.9×0.9 与 8.6-4.6×1.5，题目要求「能简算的要简算」。
      ### 2. 找联系
      左式：两个3.9 —— 想能不能看成「1个3.9减0.9个3.9」？
      ### 3. 试第一条路
      不简算：先乘后减，能算但麻烦。
      ### 4. 换路
      提取公因数：3.9×(1-0.9)=3.9×0.1=0.39。问：「下面这个更喜欢哪个？」
      ### 5. 第二、第三条路
      右式 8.6-4.6×1.5：不能人为加括号先减4.6；无运算律依据只能先乘后减。
      ### 6. 归一
      能简算要有依据（分配律）；不能因「看起来简单」乱改顺序；3.9-3.9×0.9≠0（先乘后减）。
      ### 7. 收尾
      原话：「必须有理由有依据，不能凭空虚加括号。」
  boundary: ok
  北师大单元: 一_小数的意义和加减法
