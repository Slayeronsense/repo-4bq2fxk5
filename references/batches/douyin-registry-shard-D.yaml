- id: "XTY-DY-7623788784917137600"
  file: "f:/逐字稿/抖音音频逐字稿转完/7623788784917137600.md"
  source: douyin
  grade_semester: 5下
  北师大单元: 六_长方体的认识
  人教来源提示: 表面积拼切变化（知识树校正）
  对照:
    安全等级: 绿
    适配动作: []
  题型:
  - T07
  方法:
  - 露在外面
  - 拼减少切增加
  讲法证据:
    原句摘录: 把两个棱长为一厘米的正方体拼成一个长方体，问这个长方体的表面积与原来两个正方体的表面积之和相比，是减少了还是增加了，又或者说没有发生变化。
    adapted_script: |
      ## 学情边界（北师大 5下 · 六_长方体的认识）
      - 主题：表面积拼切变化

      ## 讲题脚本
      ### 1. 理信息
      读题：两个棱长1cm正方体拼成长方体，问表面积比原来两个之和「减少/增加/不变」？
      ### 2. 找联系
      先定义：「表面积就是露在外面的6个面的面积之和。」强调「露在外面」四个字。
      ### 3. 试第一条路
      分开算：每个正方体6个面，两个共12个面。
      ### 4. 换路
      拼起来后：贴合的两个面还在里面、不「露在外面」→ 少了2个面 → 共10个面 → **减少**。
      ### 5. 第二、第三条路
      三个拼：再少2个面。反过来「切开」：又露出2个新面 → **增加**。
      ### 6. 归一
      拼起来减少，切开增加；数「露在外面的面」而不是机械数12。
      ### 7. 收尾
      操作验证：拿正方体摆一摆、拼一拼、切一切。原话：「拼起来是减少，切开就是增加。」
  boundary: ok
