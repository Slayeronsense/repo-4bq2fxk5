      ## 学情边界（北师大 4上 · 五_方向与位置）
      - 主题：方向与观测点

      ## 讲题脚本
      ### 1. 理信息
      读「体育馆在科技馆的东面」，先问：「我们站在哪儿看？」板书两个地点。
