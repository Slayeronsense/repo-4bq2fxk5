    原句摘录: 这道题是今天试卷里面做的很多的题，我们拿出来重点讲一讲，为什么要马上讲。就像我刚刚说的，我们吃了稀饭，那个碗儿，马上洗，水一冲就洗干净的。
    adapted_script: |
      ## 学情边界（北师大 3上 · 五_周长）
      - 主题：图形变化引起周长增加

      ## 讲题脚本
      ### 1. 理信息
      长方形长不变、宽增加4cm，问周长增加几厘米——「连空带猜不算厉害，讲懂方法才厉害。」
      ### 2. 找联系
      图形题先画图：原长方形 + 宽向下延长4cm，描出增加部分。
      ### 3. 试第一条路
      看图：两条长不变，宽两侧各增4 → 共增 4+4=8cm。
      ### 4. 换路
      假设法：设长10宽5，原周长(10+5)×2=30；现宽9，现周长(10+9)×2=38；差8。
      ### 5. 第二、第三条路
      换假设数据验算，结果仍为8——假设要选好算的数。
      ### 6. 归一
      周长增加看「多出来的边」；画图直观，假设法万能（高年级越用越顺）。
      ### 7. 收尾
      两种方法任选；刚错的题「马上讲、马上改」。
  boundary: ok
