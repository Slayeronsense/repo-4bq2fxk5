      - 重叠边旁两角相等
    讲法证据:
      原句摘录: "正方形四个角都是直角……重叠的角在哪……角二加角三等于90度"
      adapted_script: |
        ## 学情边界（北师大 4下 · 角的认识拓展）
        - 可用：正方形四直角=90°、重叠角关系
        - 黄标：平角180°结论为思维拓展，4下主课只用到90°
        
        ## 讲题脚本
        ### 1. 理信息
        两正方形重叠，已知∠1=60°，求∠2；标重叠区∠3。
        ### 2. 找联系
        隐含信息：正方形角=90°；∠1+∠3=90°→∠3=30°。
        ### 3. 试第一条路
        ∠2+∠3=90°→∠2=60°。
        ### 4. 换路
        不计算比较：∠1+∠3=90°且∠2+∠3=90°→∠1=∠2（重叠角相同则旁边两角相等）。
        ### 5. 第二、第三条路
        长方形重叠同理；180°平角版留作拓展不主考。
        ### 6. 归一
        重叠角题：**先找重叠角，再用90°关系**。
        ### 7. 收尾
        易错：漏隐含直角；把重叠结论无限推广到未学图形。
    boundary: ok

