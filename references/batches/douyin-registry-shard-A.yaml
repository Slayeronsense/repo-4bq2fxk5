  - id: XTY-DY-7379596704095554867
    file: f:/逐字稿/抖音音频逐字稿转完/7379596704095554867.md
    source: douyin
    grade_semester: 3下
    北师大单元: 五_面积
    人教来源提示: 4个小正方形拼组·周长与面积
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T07, T08]
    方法:
      - 拼组画图
      - 标数据
      - 面积相同周长不同
    讲法证据:
      原句摘录: "第一步画图，第二步标数据，第三步算……面积一定一样，周长却不一定一样"
      adapted_script: |
        ## 学情边界（北师大 3下 · 五_面积 + 周长回顾）
        - 拼组同时涉及周长与面积；面积看块数，周长看外圈
        - 可用：长方形周长=(长+宽)×2、面积=长×宽、计数单位块
        
        ## 讲题脚本
        ### 1. 理信息
        4个边长1cm正方形：拼成长方形 vs 拼成正方形；问各自周长、面积。
        ### 2. 找联系
        套路：**画图→标边长→再算**；同样4块，面积为何相同？
        ### 3. 试第一条路
        长方形1×4：周长(4+1)×2=10cm，面积4cm²；正方形2×2：周长8cm，面积4cm²。
        ### 4. 换路
        面积另算：1块1cm²，4块=4cm²（与公式结果一致）。
        ### 5. 第二、第三条路
        变边长2cm重算；强调16cm（周长）≠16cm²（面积）不能比。
        ### 6. 归一
        拼组题：面积看总块数不变；周长看外轮廓——**同面积可不同周长**。
        ### 7. 收尾
        判断题陷阱：相同块数拼组面积一定相同，周长不一定。
    boundary: ok

