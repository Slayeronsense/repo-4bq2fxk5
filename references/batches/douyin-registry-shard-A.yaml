  - id: XTY-DY-7587402549285178678
    file: f:/逐字稿/抖音音频逐字稿转完/7587402549285178678.md
    source: douyin
    grade_semester: 5下
    人教来源提示: 期末试卷十道选择题合集（方程/小数除/梯形/植树等跨册）
    对照:
      安全等级: 红
      适配动作:
      - 整卷超纲
      - boundary仅参考
      - 禁止按单册调用
      - 仅借讲法节奏
    题型: [T01]
    方法:
      - 分题定册
      - 假设法
      - 商不变性质
    讲法证据:
      原句摘录: "大家好，这节课我们来详细的讲一讲这张期末试卷。我们先来看选择题。"
      adapted_script: |
        ## 学情边界（北师大 · 期末卷合集）
        - 本视频为**跨册期末卷**，含代数错写、平行四边形拉成长方形、商不变、小数除去尾、小数乘法竖式意义、三角形与平行四边形面积、解方程、梯形面积、植树间隔、阴影梯形等
        - **禁止**整体挂 3上/4上 直接备课；按小题拆分后各归其册
        - 适配：整卷标 later，只借「两种方法对比」「假设法」「画图分析」讲法节奏
        
        ## 讲题脚本（以第一题代数错写为例）
        ### 1. 理信息
        板书两式：原式 4X+0.5 vs 错写 4×(X+5)；问结果比原来多还是少。
        ### 2. 找联系
        问「错在哪里？」→ 括号打开后常数项从 0.5 变成 2，差在常数项。
        ### 3. 试第一条路
        乘法分配律展开：4×(X+5)=4X+20，对比 4X+0.5，多 19.5（按原文 4×0.5=2 则多 1.5）。
        ### 4. 换路
        假设法：设 X=0（或 1、2 等简单数），分别算两式再比差。
        ### 5. 第二、第三条路
        整卷其他题（商不变统一被除数/除数、植树间隔数=闪次数-1 等）各用对应单元方法，勿混讲。
        ### 6. 归一
        「同一道题两种方法」+「先画图/标信息再列式」是整卷共通节奏。
        ### 7. 收尾
        易错：把整卷当单册题讲；超纲题（方程、梯形）仅参考讲法，不引入北师大未学工具。
    boundary: later

  - id: XTY-DY-7519083576295197991
    file: f:/逐字稿/抖音音频逐字稿转完/7519083576295197991.md
    source: douyin
    grade_semester: 4上
    北师大单元: 六_除法
    人教来源提示: 相遇问题·速度和×时间
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T11]
    方法:
      - 边读边画图
      - 速度和
      - 分段路程
    讲法证据:
      原句摘录: "什么是相遇问题呢……速度和乘时间等于总路程"
      adapted_script: |
        ## 学情边界（北师大 4上 · 行程）
        - 可用：速度×时间=路程、相向而行、速度和
        
        ## 讲题脚本
        ### 1. 理信息
        画线段表全程；两人（车）相向，标各自速度与相遇时间。
        ### 2. 找联系
        总路程=小明走的+小红走的；或=（v1+v2）×t。
        ### 3. 试第一条路
        分别算：8×4+6×4=56km。
        ### 4. 换路
        速度和： (8+6)×4=56km。
        ### 5. 第二、第三条路
        知路程求时间620÷(83+72)；一人先走再遇；环形跑道相遇。
        ### 6. 归一
        相遇问题=**必画图**+路程拆两段或速度和×时间。
        ### 7. 收尾
        易错：不标方向；把「先走时间」漏加。
    boundary: ok

  - id: XTY-DY-7359044348673133835
    file: f:/逐字稿/抖音音频逐字稿转完/7359044348673133835.md
    source: douyin
    grade_semester: 3下
    北师大单元: 五_面积
    人教来源提示: 认识面积单位·统一单位比较
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T08]
    方法:
      - 统一面积单位
      - 重叠比较
      - 平方厘米/分米/米
    讲法证据:
      原句摘录: "比较两个图形面积的大小，我们一定要用统一的面积单位"
      adapted_script: |
        ## 学情边界（北师大 3下 · 五_面积 · 02_面积单位）
        - 可用：数方格需单位统一、1cm²/1dm²/1m²大小感知
        - 禁用：未统一单位直接比个数
        
        ## 讲题脚本
        ### 1. 理信息
        出示①②两图数方格：28个 vs 24个，但格大小不同——能否直接比？
        ### 2. 找联系
        问「什么时候能数个数比？」→ **方格大小一样（统一单位）**。
        ### 3. 试第一条路
        单位不统一→重叠比对或换同一标准方格。
        ### 4. 换路
        认识1cm²（指甲盖）、1dm²（手掌/魔方面）、1m²（方桌/黑板一块）。
        ### 5. 第二、第三条路
        用1cm²量橡皮；1dm²量课桌面太大→需要更大单位m²。
        ### 6. 归一
        比面积=先统一单位；长度单位（cm）≠面积单位（cm²）。
        ### 7. 收尾
        易错：个数多就一定面积大；混淆米与平方米。
    boundary: ok

