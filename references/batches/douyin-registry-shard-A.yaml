  - id: XTY-DY-7433380715758128435
    file: f:/逐字稿/抖音音频逐字稿转完/7433380715758128435.md
    source: douyin
    grade_semester: 4上
    北师大单元: 六_除法
    人教来源提示: 上坡行程·路程不变变与不变
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T11]
    方法:
      - 边读边画图
      - 路程不变
      - 变与不变
    讲法证据:
      原句摘录: "路程变没有……变的是速度和时间，不变的是路程"
      adapted_script: |
        ## 学情边界（北师大 4上 · 行程应用）
        - 可用：速度×时间=路程、去回同路路程不变
        - 情境：上坡去、下坡回，时间变速度变
        
        ## 讲题脚本
        ### 1. 理信息
        画线段：家—上坡—姥姥家；标去时126米/分×20分；回时9分求速度。
        ### 2. 找联系
        问「回来走哪条路？」→ 同一段路，**路程不变**（2520米）。
        ### 3. 试第一条路
        去程：126×20=2520米；估：时间更短→速度更大。
        ### 4. 换路
        回程：2520÷9=280米/分；验证280>126。
        ### 5. 第二、第三条路
        岳阳楼题：720÷9得去速80，返回每小时多行10→90，720÷90=8小时——同抓路程不变。
        ### 6. 归一
        去回问题核心：**路程不变，速度和时间在变**（变与不变思想）。
        ### 7. 收尾
        易错：回程用去程速度；不画图导致路程重复或遗漏。
    boundary: ok

  - id: XTY-DY-7429219657682406693
    file: f:/逐字稿/抖音音频逐字稿转完/7429219657682406693.md
    source: douyin
    grade_semester: 4上
    北师大单元: 二_线与角
    人教来源提示: 钟面大格30°·时针分针夹角
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T12]
    方法:
      - 钟面大格30°
      - 数大格
      - 画标准钟面
    讲法证据:
      原句摘录: "一个钟面12个大格……360度除以12等于30度"
      adapted_script: |
        ## 学情边界（北师大 4上 · 线与角/时间综合）
        - 可用：周角360°、平角180°、直角90°推大格30°
        - 钟面先画标准（12-3-6-9再标其余）
        
        ## 讲题脚本
        ### 1. 理信息
        画钟面：定12/3/6/9再标数；求「一个大格对应多少度」。
        ### 2. 找联系
        三种推法：360÷12=30；180÷6=30；90÷3=30——都得**大格=30°**。
        ### 3. 试第一条路
        时针2小时走2大格→2×30=60°；分针2小时走2圈→720°。
        ### 4. 换路
        5:00较小夹角：数5个大格→150°。
        ### 5. 第二、第三条路
        反求：120°=4大格→4:00或8:00（注意两解陷阱）。
        ### 6. 归一
        钟面角题=先定大格30°，再数大格或反推大格数。
        ### 7. 收尾
        易错：钟面画不准；120°漏8:00解；混淆时针分针走格数。
    boundary: ok

