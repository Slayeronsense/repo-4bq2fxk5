      duizhao: 本课不在四下对照表内；八方向基线见 BASELINE-八方向（2下已学）
      安全等级: 绿
      适配动作:
      - 主挂改4上非3下
      - 保留观测点三步法
      - 西东写在前
    题型: [T13]
    方法:
      - M34-21定观测点三步法
      - 边读边画
      - 固定再换
    讲法证据:
      原句摘录: "第一步确定了观测点。第二步把方向标移到观测点去。第三步再来看……"
      教学口令:
        - "谁是观测点？"
        - "把方向标移到观测点"
        - "西写在前面，不要写北西"
        - "四面指四个方向，八方指八个方向"
      叫法:
        - 观测点（站在被看的那一方看）
        - 方向标（上北下南左西右东）
        - 西北/东南（相对方向成对）
      adapted_script: |
        ## 学情边界（北师大 4上 · 五 方向与位置）
        - 可用：东南西北（2下基线）、八个斜向、观测点、相对方向
        - 本课生长点：在八方向基础上描述路线（去图书馆）；本视频侧重八方向巩固
        - 禁用：量角器定方向、比例尺、坐标系
        
        ## 讲题脚本
        ### 1. 理信息
        板书校园平面图：食堂、教学楼、存车处、多功能厅；读「A 在 B 的什么方向」。
        ### 2. 找联系
        追问：「A 在 B 的哪面 = 站在哪里看 A？」→ **观测点永远是「被看的那一方」（B）**。
        ### 3. 试第一条路
        正方向：方向标移到观测点，上北下南左西右东，直接读东/西/南/北。
        ### 4. 换路
        斜方向：在两主方向之间，如西北=西与北之间；**东/西写在前**（全国习惯，不写北西）。
        ### 5. 第二、第三条路
        反向验证：食堂在存车处西北 ↔ 存车处在食堂东南（相对方向成对）。
        观测点切换：同一对物体，换观测点则方向描述变、方法不变。
        ### 6. 归一
        三步法：**定观测点 → 移方向标 → 读方向**；从 4 向到 8 向，方法不变。
        ### 7. 收尾
        易错：观测点选成「看的那一方」；写北西。常识：四面=4向，八方=8向。
    类似题特征: 平面图认八方向、观测点切换、相对方向成对
    boundary: ok

