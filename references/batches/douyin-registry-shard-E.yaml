      adapted_script: |
        ## 学情边界（北师大 2上）
        - 可用：十位×10+个位
        - 禁用：字母代数
        
        ## 讲题脚本
        ### 1. 理信息
        个位A十位B，求两位数。
        ### 2. 找联系
        问「B在十位表示几个十？」
        ### 3. 试第一条路
        B×10+A。
        ### 4. 换路
