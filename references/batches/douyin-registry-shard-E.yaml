      - 余数含义
    讲法证据:
      原句摘录: "16乘4加5等于69，所以69除以4等于16余5，这句话对吗？"
      adapted_script: |
        ## 学情边界（北师大 3下 · 一_除法）
        - 可用：商×除数+余数=被除数
        - 禁用：余数≥除数
        
        ## 讲题脚本
        ### 1. 理信息
        判断：由16×4+5=69能否推出69÷4=16余5。
        ### 2. 找联系
        验算：16×4+5是否等于69——算理对。
        ### 3. 试第一条路
        但需检查余数5是否小于除数4——不对！
        ### 4. 换路
        重算69÷4=17余1。
        ### 5. 第二、第三条路
        归纳验算两步：等式+余数合法。
        ### 6. 归一
        除法验算=商×除数+余数，且余数<除数。
        ### 7. 收尾
        乘加算式对不代表除法表述对。
    boundary: ok
