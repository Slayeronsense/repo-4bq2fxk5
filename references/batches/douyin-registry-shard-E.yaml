    题型: [T05]
    方法:
      - 乘法意义
    讲法证据:
      原句摘录: "零乘任何数都得0……0个100或100个0。"
      adapted_script: |
        ## 学情边界（北师大 3上 · 三_乘法）
        - 可用：0×a=0的意义解释
        - 禁用：与4下混合运算混讲
        
        ## 讲题脚本
        ### 1. 理信息
        0×100、100×0等，归纳规律。
        ### 2. 找联系
        0个100相加=0；100个0相加=0。
        ### 3. 试第一条路
        举例验证。
        ### 4. 换路
        对比任何数+0与任何数×0。
        ### 5. 第二、第三条路
        判断题：0×5=5？错。
        ### 6. 归一
        0乘任何数都得0。
        ### 7. 收尾
        别与「任何数减0」混淆。
    boundary: ok
