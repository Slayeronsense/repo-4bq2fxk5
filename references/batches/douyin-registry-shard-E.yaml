    题型: [T08]
    方法:
      - 统一单位
      - 比价
    讲法证据:
      原句摘录: "90厘米编一个中国结……10米丝绳编8个够不够？"
      adapted_script: |
        ## 学情边界（北师大 3下）
        - 可用：米厘米换算、乘除比较
        - 禁用：复杂分数
        
        ## 讲题脚本
        ### 1. 理信息
        每个结90厘米，10米绳编8个够不够。
        ### 2. 找联系
        先统一单位：10米=1000厘米。
        ### 3. 试第一条路
        90×8=720，720<1000，够。
        ### 4. 换路
        1000÷90≈11，能编11个，8个够。
        ### 5. 第二、第三条路
        两种比法对照。
        ### 6. 归一
        够不够先统一单位再比。
        ### 7. 收尾
        10米别写成10厘米——单位追问。
    boundary: ok
