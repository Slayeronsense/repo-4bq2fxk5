      adapted_script: |
        ## 学情边界（北师大 3上）
        - 主题：估算辨析（「大约」已含估算）
        - 可用：18×20 口算；理解「每行最多20字≈大约20字」
        - 禁用：见「大约」就再估成18×2
        ## 讲题脚本
        ### 1. 理信息
        每行**最多/大约**20字、18行；问大约多少字。
        ### 2. 找联系
        问：「20字已经是大约了，还要再估吗？」——18×20=360。
        ### 3. 试第一条路
        错路：18≈20再乘20→二次估算；明说「这条路行不通」。
        ### 4. 换路
        走路题：每步**大约**45cm、880步→45已估，直接乘。
        ### 5. 第二、第三条路
        归纳：「大约」在条件里=已估算；不是见到就再估。
        ### 6. 归一
        先判断哪个数已经是不精确量，再决定要不要估。
        ### 7. 收尾
        易错：18×20本可口算却硬估。
