    北师大单元: 六_认识分数
    人教来源提示: 内容审查误挂6上+误标三角形·原题为分数意义复习
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T01]
    方法:
      - 图形平均分
      - 数轴直观（拓展）
    讲法证据:
      原句摘录: "分数用分数来表示的前提一定是要进行平均……三是什么分他表示什么呢？"
      adapted_script: |
        ## 学情边界（北师大 3下 · 分数）
        - 主题：分数意义（平均分几份取几份）
        - 可用：长方形/圆/多图形平均分；分数线=平均分
        - 禁用：三角形性质、角度计算
        ## 讲题脚本
        ### 1. 理信息
        复习 1/3：分数线表示平均分、分母=分几份、分子=取几份。
        ### 2. 找联系
        问：「不平均分能不能写分数？」——必须平均分。
        ### 3. 试第一条路
        线段平均分成2份→1/2；再分成3份找1/3，比较 1/2 与 1/3。
        ### 4. 换路
        数轴拓展：0—1/2—1，标 1/3 位置（直观感受，不考）。
        ### 5. 第二、第三条路
        见分数想「分」——平均分了几份、取了几份。
        ### 6. 归一
        分数是平均分的记录：先整体，再份数，再取的份数。
        ### 7. 收尾
        易错：不平均分就写分数；分子分母颠倒。
    boundary: ok
