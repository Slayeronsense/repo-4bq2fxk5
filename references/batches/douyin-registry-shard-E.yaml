  - id: XTY-DY-7301519820342824243
    file: f:/逐字稿/抖音音频逐字稿转完/7301519820342824243.md
    source: douyin
    grade_semester: 3下
    北师大单元: 三_乘法
    人教来源提示: 人教三上·三位数乘一位数进位
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T06]
    方法:
      - 竖式意义
      - 满几十进几
    讲法证据:
      原句摘录: "213乘4……满几十就向前一位进几……连续进位。"
      adapted_script: |
        ## 学情边界（北师大 3下 · 三_乘法）
        - 可用：相同数位对齐、从个位乘、进位
        - 禁用：两位数×两位数（3下末）
        
        ## 讲题脚本
        ### 1. 理信息
        213×4竖式，对比昨天不进位与今天进位。
        ### 2. 找联系
        问「4乘3得12，2写哪？1进哪？」
        ### 3. 试第一条路
        分步：个位→十位（加进位）→百位。
        ### 4. 换路
        在竖式旁标小进位1。
        ### 5. 第二、第三条路
        213×7连续进位对比。
        ### 6. 归一
        进位乘法=乘+加进位，满几十进几。
        ### 7. 收尾
        十位乘完忘记加进位——最高频错。
    boundary: ok
