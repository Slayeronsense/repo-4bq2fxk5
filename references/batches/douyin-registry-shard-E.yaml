    讲法证据:
      原句摘录: "被减数减少58，减数减少58，差不变……三种方法：举例、公式、一减一增。"
      adapted_script: |
        ## 学情边界（北师大 2下/3上）
        - 可用：举例验算、一减一增抵消
        - 禁用：字母公式推导
        
        ## 讲题脚本
        ### 1. 理信息
        判断：被减数、减数同减58，差变不变？
        ### 2. 找联系
        举例60-59=1，同减58后1-1=0，差仍为0。
        ### 3. 试第一条路
        再举58-58=0验证。
        ### 4. 换路
        口述：被减数少58差少58，减数少58差反增58，抵消。
        ### 5. 第二、第三条路
        对比只变被减数或只变减数的情况。
        ### 6. 归一
        同增同减相同量，差不变。
        ### 7. 收尾
        别与「被减数减多少差减多少」单条规律混。
