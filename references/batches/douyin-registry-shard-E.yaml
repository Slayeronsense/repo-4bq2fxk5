    北师大单元: 七_加与减（二）
    人教来源提示: 内容审查误挂6上·原题为20以内进位加法单元整理
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T05]
    方法:
      - 加法表整理
      - 画图（吃了+剩下=原来）
    讲法证据:
      原句摘录: "今天我们来学习20以内的进位加法整理和复习。"
      adapted_script: |
        ## 学情边界（北师大 1上 · 七_加与减（二））
        - 主题：20以内进位加法整理复习
        - 可用：加法表交换律、同一图不同角度列式、吃了+剩下=原来
        - 禁用：方程、倒推符号链
        ## 讲题脚本
        ### 1. 理信息
        单元结构：计算（9/8/7/6/5加几）+解决问题两类；出示加法表填得数。
        ### 2. 找联系
        竖着横着看规律→8+9=9+8，36道只需熟练20道。
        ### 3. 试第一条路
        花盆图：上8+下6=14；换颜色7+7=14——同一幅图两个加法算式。
        ### 4. 换路
        兔子题：吃了6个○，剩7个○，原来？6+7=13；关系「吃了+剩下=原来」。
        ### 5. 第二、第三条路
        对比按位置合与按颜色合；口算表与画图法适用场景。
        ### 6. 归一
        加法都是两部分合起来；观察角度不同，算式可以不同。
        ### 7. 收尾
        易错：求原来用减法；强调合起来用加法。
    boundary: ok
