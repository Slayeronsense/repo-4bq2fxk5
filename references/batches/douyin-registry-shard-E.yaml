    source: douyin
    grade_semester: 3下
    北师大单元: 五_面积
    人教来源提示: 人教三下·数长方形个数
    对照:
      安全等级: 黄
      适配动作:
      - 标注思维拓展
    题型: [T12]
    方法:
      - 长边线段×宽边线段
      - 标块数
    讲法证据:
      原句摘录: "图中有多少个长方形……长边线段数乘宽边线段数……6乘3加2。"
      adapted_script: |
        ## 学情边界（北师大 3下 · 拓展）
        - 可用：标块分列、基本图形公式法
        - 适配：思维提高，标注拓展
        
        ## 讲题脚本
        ### 1. 理信息
        复杂图数长方形总个数。
        ### 2. 找联系
        问「能变回学过的标准图吗？」——擦掉多余线。
        ### 3. 试第一条路
        标块数1–7块分别列组合（易错路）。
        ### 4. 换路
        长边6条线段×宽边3条=18，再加多线带来的2个。
        ### 5. 第二、第三条路
        对比枚举法与公式法优劣。
        ### 6. 归一
        难题=基础题型+小变形，先还原再算。
        ### 7. 收尾
        标块法块数多易数错，优先找基本形。
    boundary: ok
