    讲法证据:
      原句摘录: "每支玫瑰9元，王阿姨带了100元，问购买12支玫瑰吗？"
      adapted_script: |
        ## 学情边界（北师大 3上）
        - 主题：够不够（单价×数量）
        - 可用：9×12 与 100 比；100÷9 得11余1 与 12 比
        - 禁用：方程
        ## 讲题脚本
        ### 1. 理信息
        板书：9元/支、100元、12支；关系式「单价×数量=总价」。
        ### 2. 找联系
        问：可以比总价，还能比能买几支（数量）。
        ### 3. 试第一条路
        乘法：9×12=108>100→不够。
        ### 4. 换路
        除法：100÷9=11……1，只能买11支<12→不够；余1是1元不是1支。
        ### 5. 第二、第三条路
        对比「比钱」与「比支数」；同一结论两种算法。
        ### 6. 归一
        够不够都是比较两个量；乘法看总价，除法看数量。
        ### 7. 收尾
        易错：余数当支数。
