    讲法证据:
      原句摘录: "昨天我们学了66除以3这种类型的口算。"
      adapted_script: |
        ## 学情边界（北师大 3下 · 三_除法）
        - 主题：两位数÷一位数口算
        - 可用：先分再合（60÷3+6÷3）、推广到三位数每位都能整除
        - 禁用：有余数竖式复杂试商
        ## 讲题脚本
        ### 1. 理信息
        板书 66÷3，问口算过程；学生说「60÷3=20，6÷3=2，20+2=22」。
        ### 2. 找联系
        标颜色：66**分**成60和6，分别除，再**合**成22。
        ### 3. 试第一条路
        88÷2、68÷2 让学生仿做。
        ### 4. 换路
        248÷2：分成200、40、8分别除再相加——「每位都能被除数整除就能先分再合」。
        ### 5. 第二、第三条路
        回扣 98+12 的拆合；对比加减乘里的先分再合。
        ### 6. 归一
        复杂口算先拆成几个简单部分，算完再合并。
        ### 7. 收尾
        易错：只除十位忘记个位。
    boundary: ok
