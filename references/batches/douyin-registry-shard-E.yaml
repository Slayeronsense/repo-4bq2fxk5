      adapted_script: |
        ## 学情边界（北师大 3上）
        - 主题：行程问题（够不够到达）
        - 可用：36×12 与 420 比较；线段图标全程
        - 禁用：420÷12（除数是两位数，逐字稿明示未学）
        ## 讲题脚本
        ### 1. 理信息
        板书：420km、36km/h、7时出发、**行驶12小时**；画甲乙港线段。
        ### 2. 找联系
        问：「比什么？」——12小时走多远（36×12）和全程420比。
        ### 3. 试第一条路
        36×12=432>420→能到达且超出；图上标超出部分。
        ### 4. 换路
        追问「7时用到了吗？」——干扰信息；变式「12时能到达吗」→只走5小时，5×36=180<420。
        ### 5. 第二、第三条路
        对比「行驶12小时」与「12时到达」措辞差异。
        ### 6. 归一
        到不到先看走了多少路，再和总路程比；读清是行驶时间还是时刻。
        ### 7. 收尾
        易错：把7时当行驶时间；每条信息都强行用。
    boundary: ok
  - id: XTY-DY-7352406185724661042
    file: f:/逐字稿/抖音音频逐字稿转完/7352406185724661042.md
    source: douyin
    grade_semester: 3上
    北师大单元: 三_加与减
    人教来源提示: 内容审查误挂6上·逐字稿明示三年级·大巴估算够不够
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T11]
    方法:
      - 除法估算比价
      - 乘法估算比价
    讲法证据:
      原句摘录: "三年级196名师生去长城进行研学活动，每辆中型大巴车现乘客41人……租5辆中型大巴车够吗？"
      adapted_script: |
        ## 学情边界（北师大 3上）
        - 主题：估算够不够（乘除双路径）
        - 可用：196≈200、41≈40；除法路径 200÷5≈40；乘法路径 40×5≈200
        - 禁用：精确计算代替估算；估算写「=」
        ## 讲题脚本
        ### 1. 理信息
        板书：196人、41人/车、5辆车；圈出「估算」「约等于」。
        ### 2. 找联系
        除法：5辆车平均每人坐几人，和41比；乘法：5辆车共坐几人，和196比。
        ### 3. 试第一条路
        除法：196→200，200÷5≈40；心里知道实际<40，仍<41→够。
        ### 4. 换路
        乘法：41→40，40×5≈200；估少了都有200，实际更多→够。
        ### 5. 第二、第三条路
        对比两种估法；强调符号用≈不用=。
        ### 6. 归一
        够不够都是比较两个量；乘除是同一问题的两条路。
        ### 7. 收尾
        易错：不估算；只写一种方法；符号写等号。
    boundary: ok
