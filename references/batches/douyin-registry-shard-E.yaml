    人教来源提示: 内容审查误挂6上·原题为三位数÷一位数商位数逆推
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T06]
    方法:
      - 竖式转化
      - 首位与除数比大小
    讲法证据:
      原句摘录: "知道三位数和一位数，判断商是两位数还是三位数……求这个一位数最小可以填多少。"
      adapted_script: |
        ## 学情边界（北师大 4上 · 六_除法）
        - 主题：商位数逆推求除数
        - 可用：画竖式；百位与除数比大小；商两位→除数>百位
        - 禁用：除数是两位数的除法
        ## 讲题脚本
        ### 1. 理信息
        已知三位数被除数、商是两位数，求除数最小填几；画竖式空框。
        ### 2. 找联系
        商是两位→百位不够分→除数比百位大。
        ### 3. 试第一条路
        百位是7：除数比7大→8或9；最小填8。
        ### 4. 换路
        变式商是三位→除数≤百位，最大填7（相等时刚好够分）。
        ### 5. 第二、第三条路
        对比「已知除数判商几位」与「已知商几位求除数」。
        ### 6. 归一
        看不懂就化成竖式；比被除数首位和除数谁大。
        ### 7. 收尾
        易错：忽略除数=百位时仍够分。
    boundary: ok
