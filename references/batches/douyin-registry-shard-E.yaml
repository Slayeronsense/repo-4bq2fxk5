    file: f:/逐字稿/抖音音频逐字稿转完/7301819109686152475.md
    source: douyin
    grade_semester: 4上
    北师大单元: 四_乘法
    人教来源提示: 内容审查误挂6上·原题为乘法错中求解（积少27）
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T10]
    方法:
      - 错算式+正算式对照
      - 差额÷多加份数
    讲法证据:
      原句摘录: "把一个乘数59看成了56，积比正确的少27。问，正确的积是多少？"
      adapted_script: |
        ## 学情边界（北师大 4上 · 乘法）
        - 主题：乘法错中求解
        - 可用：56×□与59×□；积差27对应乘数差3
        - 禁用：设x列方程
        ## 讲题脚本
        ### 1. 理信息
        59看成56，积比正确少27；写错式56×□、正式59×□=？
        ### 2. 找联系
        同一□：56份 vs 59份，少3份→积少27。
        ### 3. 试第一条路
        □=27÷3=9；正确积59×9（进位竖式）。
        ### 4. 换路
        对比加减错中求解：这次给「相差多少」而非错的积。
        ### 5. 第二、第三条路
        画图：一份□，少3份就是少27。
        ### 6. 归一
        先写两式找份数差，再求□，最后算正确积。
        ### 7. 收尾
        易错：把27当正确积。
    boundary: ok
