      - 标注思维拓展
    题型: [T12]
    方法:
      - 韦恩图法
      - 减重复部分
    讲法证据:
      原句摘录: "这一道集合问题就是一位学生家长发给老师的，他让尹老师给他的孩子讲一下他为什么我的孩子嗯对集合问题这部分老师觉得不好。"
      adapted_script: |
        ## 学情边界（北师大 3下 · 思维拓展）
        - 主题：两集合求总人数（维恩图）
        - 适配：课标外集合，借画图讲法；仅参考
        ## 讲题脚本
        ### 1. 理信息
        英语18人、作文22人、两项都参加14人；问至少参加一项多少人。
        ### 2. 找联系
        读到「两项都参加」→画两圈重叠；分三类：只英语、只作文、都参加。
        ### 3. 试第一条路
        蓝圈18、绿圈22，重叠14；只英语=18-14，只作文=22-14。
        ### 4. 换路
        18+22把14算了两次→18+22-14=26（两边之和减中间重复）。
        ### 5. 第二、第三条路
        也可把三类相加验算；三项目时仍「加各圈减重复」。
        ### 6. 归一
        集合题：画图找重复→重复几次减几次。
        ### 7. 收尾
        易错：不会减中间重复；把圈的总数当「只参加」人数。
    boundary: ok
