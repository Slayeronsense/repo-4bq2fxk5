            线段三要素：直、两个端点、可测量。
            ### 5. 第二、第三条路
            选合适单位：课桌宽用厘米不是米。
            ### 6. 归一
            先定单位再测量；大单位换小单位×进率。
            ### 7. 收尾
            估测前先脑中有一厘米、一米多长。
