    source: douyin
    grade_semester: 4上
    北师大单元: 一_认识更大的数
    人教来源提示: 整万数近似（大数认识）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T04]
    方法:
      - 数轴定位
      - 分级
    讲法证据:
      原句摘录: "整万数末尾至少4个0；最接近的整万数在数轴上找左右相邻整万，比它小填左边，比它大填右边。"
      adapted_script: |
            ## 学情边界（北师大 4上 · 一_认识更大的数）
            - 主题：填最接近的整万数
            
            ## 讲题脚本
            ### 1. 理信息
            分级：287000是28万多；圈「整万」「最接近」。
            ### 2. 找联系
            整万=末尾0000；最接近=数轴上挨着的整万。
            ### 3. 试第一条路
            画数轴：27万—28万—29万—30万；标287000位置。
            ### 4. 换路
            比它小的最近整万：28万；比它大的最近整万：29万。
            ### 5. 第二、第三条路
            9897000：左989万，右990万。
            ### 6. 归一
            先分级定位，再数轴找左右邻居。
            ### 7. 收尾
            第一印象很重要；没听懂立刻举手再讲一遍。
    boundary: ok
