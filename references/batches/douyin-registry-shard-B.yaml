    题型: [T25]
    方法:
      - 大格30度
      - 半格15度
    讲法证据:
      原句摘录: "12大格周角360°，每格30°；4时30分时针在四和五中间，夹角=30+15=45°。"
      adapted_script: |
            ## 学情边界（北师大 4上 · 二_线与角）
            - 主题：钟表角度
            
            ## 讲题脚本
            ### 1. 理信息
            问4:30时针分针较小夹角；先定大格=30°。
            ### 2. 找联系
            360÷12=30°；也可平角180÷6或直角90÷3验证。
            ### 3. 试第一条路
            4:30分针指6，时针在四五之间（不是指4）。
            ### 4. 换路
            夹角=1大格+半格=30+15=45°。
            ### 5. 第二、第三条路
            8:30→75°；6:40时针偏七为锐角。
            ### 6. 归一
            整点看格数；半点多半格；非整点先定时针位置。
            ### 7. 收尾
            易错：30分仍把时针指向整点数字。
