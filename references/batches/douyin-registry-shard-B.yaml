    讲法证据:
      原句摘录: "连加连减有三种竖式：分开算、拼起来、合起来一步到位；加减混合没括号只有两种，不能合一步。"
      adapted_script: |
            ## 学情边界（北师大 2下 · 一_除法/加减竖式）
            - 主题：二年级竖式书写格式
            
            ## 讲题脚本
            ### 1. 理信息
            分两类：连加连减 vs 加减混合（有无括号）。
            ### 2. 找联系
            只有一种运算符号→可合一步；两种符号→不能硬合。
            ### 3. 试第一条路
            连加：分开写→拼起来→三数一步加。
            ### 4. 换路
            连减同理；借位连续退位要标清。
            ### 5. 第二、第三条路
            无括号混合：只能分开或拼两步；有小括号先算括号。
            ### 6. 归一
            选竖式格式看：几种运算符号、要不要先算括号。
            ### 7. 收尾
            减号在括号外时不能拼（89-40≠40-29）。
    boundary: ok
