      adapted_script: |
            ## 学情边界（北师大 2下 · 一_除法）
            - 主题：三位数除以一位数竖式
            
            ## 讲题脚本
            ### 1. 理信息
            板书竖式；从百位开始除，商写在被除数对应数位上。
            ### 2. 找联系
            「几个百÷2」→商在百位；余下再和十位合起来除。
            ### 3. 试第一条路
            逐位除：百→十→个；每步说清「分成几份」。
            ### 4. 换路
            第二个竖式对比：商的每一位表示什么计数单位。
            ### 5. 第二、第三条路
            验算：商×除数+余数=被除数。
            ### 6. 归一
            除法竖式=按位值分份，商的位置跟位值走。
            ### 7. 收尾
            易错：商写错位；不知道2表示2个百还是2个一。
