  - id: XTY-DY-7370921898932243775
    file: f:/逐字稿/抖音音频逐字稿转完/7370921898932243775.md
    source: douyin
    grade_semester: 4下
    北师大单元: 一_小数的意义和加减法
    人教来源提示: 小数与整数比大小复习（人教四下）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T19]
    方法:
      - 位值比较法
      - 统一单位
    讲法证据:
      原句摘录: "咱们来比较数字的大小，无论哪种情况，最后其实都是落脚到比较数字的大小；小数先看整数部分，整数部分一样再看小数部分。"
      adapted_script: |
            ## 学情边界（北师大 4下 · 一_小数的意义和加减法）
            - 主题：小数比大小（与整数比大小同构）
            
            ## 讲题脚本
            ### 1. 理信息
            板书两组数：纯数字比较 + 带单位比较；圈「整数部分」「小数部分」「单位是否相同」。
            ### 2. 找联系
            问：整数比大小先看什么？→数位/位数；小数比大小先看什么？→整数部分，一样再看小数部分。
            ### 3. 试第一条路
            位数不同：位数多的数大（举209与99）。位数相同：从最高位比起。
            ### 4. 换路
            带单位：单位相同直接比数；单位不同先统一（9分米=0.9米），再比。
            ### 5. 第二、第三条路
            有时不必统一：8.9元与9元，9元已更大，直接判断。
            ### 6. 归一
            「不管整数还是小数，最后都是比相同计数单位里谁大」。
            ### 7. 收尾
            易错：把整数「末位对齐」迁移到小数；单位没统一就硬比。
    boundary: ok
  - id: XTY-DY-7283137647088766245
    file: f:/逐字稿/抖音音频逐字稿转完/7283137647088766245.md
    source: douyin
    grade_semester: 2下
    北师大单元: 三_分一分与除法
    人教来源提示: 绳子对折平均分（二年级除法意义）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T01]
    方法:
      - 对折操作验证
      - 统一单位
    讲法证据:
      原句摘录: "对折两次平均分成4份，总长÷份数=每段长；不够分时把大单位换成小单位，像100元换5张20元。"
      adapted_script: |
            ## 学情边界（北师大 2下 · 三_分一分与除法）
            - 主题：对折后求每段长（平均分）
            
            ## 讲题脚本
            ### 1. 理信息
            读题：绳子对折几次？每段多长？已知总长。拿绳/纸折一折验证。
            ### 2. 找联系
            对折1次→2段；对折2次→4段。「平均分」→除法。
            ### 3. 试第一条路
            一路：4÷4=1（分米）。二路：4÷2÷2，每对折一次÷2。
            ### 4. 换路
            2分米÷4不会算→换20厘米，20÷4=5厘米。
            ### 5. 第二、第三条路
            生活类比：100元给5人，不能撕钱，去商店换5张20元再分。
            ### 6. 归一
            对折题本质：先定份数，再总长÷份数；除不尽就换小单位。
            ### 7. 收尾
            易错：对折次数与段数搞反；答句单位跟题目走。
    boundary: ok
  - id: XTY-DY-7295381462650572082
    file: f:/逐字稿/抖音音频逐字稿转完/7295381462650572082.md
    source: douyin
    grade_semester: 3上
    北师大单元: 三_加与减
    人教来源提示: 三位数加减竖式复习
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T06]
    方法:
      - 相同数位对齐
      - 进退位标记
    讲法证据:
      原句摘录: "相同数位对齐，从个位算起；满十向前一位进一；连续退位要标两个退位点，新朋友不能丢。"
      adapted_script: |
            ## 学情边界（北师大 3上 · 三_加与减）
            - 主题：三位数加减竖式与验算
            
            ## 讲题脚本
            ### 1. 理信息
            板书一道进位加、一道连续退位减；圈「相同数位」「从哪一位算起」。
            ### 2. 找联系
            加法满十进一；减法不够减向前借一当十——和进退位是一家人。
            ### 3. 试第一条路
            按步骤算：对齐→个位→十位→百位；进位「1」写在横线上别丢。
            ### 4. 换路
            千位前无位：最高位进位可省略不写（如458+258）。
            ### 5. 第二、第三条路
            连续退位：十位没有就向百位借；两个退位符号都要标。
            ### 6. 归一
            竖式关键：相同计数单位对齐 + 进退位不丢。
            ### 7. 收尾
            验算：加法用减法，减法用加法；交换加数也可验。
    boundary: ok
