    讲法证据:
      原句摘录: "44人含只爱苹果、只爱橘子、两样都爱、都不爱四种；25人爱苹果不是只爱苹果，要减交叉5人。"
      adapted_script: |
            ## 学情边界（北师大 3下 · 思维拓展）
            - 主题：集合/维恩图
            - 适配：课标外思维拓展，借画图分类讲法
            
            ## 讲题脚本
            ### 1. 理信息
            列四种人：只苹果、只橘子、都爱、都不爱；圈「既…又…」提示交叉。
            ### 2. 找联系
            读到交叉→画两个圈；总数=四部分之和。
            ### 3. 试第一条路
            苹果圈25含交叉：只苹果=25-5=20；只橘子=12-5=7。
            ### 4. 换路
            都不爱=44-20-7-5=12。
            ### 5. 第二、第三条路
            手脑并用：草稿列出类型再填数，别光靠想。
            ### 6. 归一
            集合题：分类→画图→求缺少那一块。
            ### 7. 收尾
            易错：把「爱苹果25」当成只爱苹果。
