    题型: [T01]
    方法:
      - 线段图
      - 找桥梁分数
    讲法证据:
      原句摘录: "分子同1分母小分数大；先比会比的，用5分之1当桥梁把7分之1和5分之3连起来。"
      adapted_script: |
            ## 学情边界（北师大 3下 · 六_认识分数）
            - 主题：三个分数排序
            
            ## 讲题脚本
            ### 1. 理信息
            板书1/5、1/7、3/5；目标：从小到大排列。
            ### 2. 找联系
            两个两个比；看不出的找「桥梁」分数。
            ### 3. 试第一条路
            1/5与1/7：同分子看分母，分母小的大；画线段验证。
            ### 4. 换路
            1/5与3/5：同分母看分子，3个1/5更大。
            ### 5. 第二、第三条路
            连起来：1/7<1/5<3/5；若只比1/7和3/5，仍用1/5当桥梁。
            ### 6. 归一
            分数比大小：能直接比就比，不能就找中间桥梁。
            ### 7. 收尾
            记不住口诀就举蛋糕均分例子。
    boundary: ok
