      adapted_script: |
            ## 学情边界（北师大 3下 · 七_年月日）
            - 主题：闰年与2月最后一天
            
            ## 讲题脚本
            ### 1. 理信息
            1992年2月最后一天→问出生日期。
            ### 2. 找联系
            平年2月28天，闰年2月29天；最后一天即月末。
            ### 3. 试第一条路
            判闰年：1992÷4整除→闰年→2月29日。
            ### 4. 换路
