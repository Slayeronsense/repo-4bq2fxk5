    file: f:/逐字稿/抖音音频逐字稿转完/7349750634976955674.md
    source: douyin
    grade_semester: 4上
    北师大单元: 四_运算律
    人教来源提示: 错中求解（除数看错）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T10]
    方法:
      - 正确错误算式对照
      - 变形找差
    讲法证据:
      原句摘录: "除数11错写13，商多3余数同；两式变形相减，多3个除数=131-113=18，除数=6。"
      adapted_script: |
            ## 学情边界（北师大 4上 · 四_运算律/除法）
            - 主题：错中求解（除数看错）
            
            ## 讲题脚本
            ### 1. 理信息
            写正确式□÷□=□…△与错误式131÷□=□…△；商多3。
            ### 2. 找联系
            被除数=商×除数+余数；两式余数相同。
            ### 3. 试第一条路
            变形：□×商1+△=131，□×商2+△=113。
            ### 4. 换路
            商1比商2多3→多3个□→131-113=18→□=6。
            ### 5. 第二、第三条路
            回代验算：131÷6与113÷6余数同、商差3。
            ### 6. 归一
            错中求解万能：列对错两式→找隐藏相同与相差。
            ### 7. 收尾
            难题也是基础变形，别被四个未知数吓住。
    boundary: ok
