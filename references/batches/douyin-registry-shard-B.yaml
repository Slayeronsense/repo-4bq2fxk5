    北师大单元: 五_面积
    人教来源提示: 面积单位判断（黑板1平方米）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T07]
    方法:
      - 生活估测
      - 单位表象
    讲法证据:
      原句摘录: "黑板面积约10平方米不是1平方米；用生活经验判断面积单位是否合理。"
      adapted_script: |
            ## 学情边界（北师大 3上 · 五_面积）
            - 主题：面积单位判断
            
            ## 讲题脚本
            ### 1. 理信息
            判断题：黑板面积约1平方米？
            ### 2. 找联系
            脑中1平方米≈边长1米的正方形；黑板远大于此。
            ### 3. 试第一条路
            估测教室黑板宽几米、高几米，相乘约十几平方米。
            ### 4. 换路
            对比：1平方米地铺、课桌面约几分之一平方米。
            ### 5. 第二、第三条路
            说理由说服同学，不是只猜对错。
            ### 6. 归一
            面积判断=生活表象+单位大小感。
            ### 7. 收尾
            易错：把长度单位感觉套到面积。
    boundary: ok
  - id: XTY-DY-7628195011540142050
    file: f:/逐字稿/抖音音频逐字稿转完/7628195011540142050.md
    source: douyin
    grade_semester: 4下
    北师大单元: 一_小数的意义和加减法
    人教来源提示: 体积单位换算（复合单位）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T08]
    方法:
      - 拆分复合单位
      - 小化大除以进率
    讲法证据:
      原句摘录: "一个等号是整式换算；两个等号要分段，2dm³70cm³先变2.07dm³再变2070cm³。"
      adapted_script: |
            ## 学情边界（北师大 4下 · 单位换算拓展）
            - 主题：复合体积单位换算（单等号vs双等号）
            
            ## 讲题脚本
            ### 1. 理信息
            对比两题：一个等号 vs 两个等号，结果不同。
            ### 2. 找联系
            双等号分段看：前段换大单位，后段再换小单位。
            ### 3. 试第一条路
            2dm³70cm³=2dm³+0.07dm³=2.07dm³（70÷10）。
            ### 4. 换路
            2.07dm³=2070cm³（×1000或×进率按题意）。
            ### 5. 第二、第三条路
            单等号题可直接对应升毫升类比理解。
            ### 6. 归一
            复合单位先拆再换；看清几个等号决定几步。
            ### 7. 收尾
            易错：双等号题当成一步直接搬数字。
    boundary: ok
  - id: XTY-DY-7352743276719443237
    file: f:/逐字稿/抖音音频逐字稿转完/7352743276719443237.md
    source: douyin
    grade_semester: 4上
    北师大单元: 四_运算律
    人教来源提示: 乘法点子图（两位数乘一位数）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T06]
    方法:
      - 点子图分块
      - 部分积相加
    讲法证据:
      原句摘录: "点子图在上一周讲过，用格子图把乘法分成几个部分再相加。"
      adapted_script: |
            ## 学情边界（北师大 4上 · 四_运算律/乘法）
            - 主题：点子图表示乘法
            
            ## 讲题脚本
            ### 1. 理信息
            画点子图表示乘法算式；圈行与列。
            ### 2. 找联系
            乘法=行数×每行几个点；可拆成整十+个位。
            ### 3. 试第一条路
            如12×4：先算10×4，再算2×4，相加。
            ### 4. 换路
            与竖式对照：部分积对应点子图哪一块。
            ### 5. 第二、第三条路
            交换因数，图旋转验证积不变。
            ### 6. 归一
            点子图=看见「几个几」；竖式是同一想法的写法。
            ### 7. 收尾
            易错：拆块后漏加一块。
    boundary: ok