    grade_semester: 4下
    北师大单元: 四_观察物体
    人教来源提示: 人教三上观察物体（北师大4下）
    对照:
      安全等级: 绿
      适配动作: []
    题型: [T13]
    方法:
      - 定观测点
      - 抓特征连线
    讲法证据:
      原句摘录: "从不同的位置观察同一个物体所看到的图形一般是不同的；观察杯子要抓杯子把在哪一侧。"
      adapted_script: |
            ## 学情边界（北师大 4下 · 四_观察物体）
            - 主题：从不同位置观察同一物体
            
            ## 讲题脚本
            ### 1. 理信息
            标清观测者位置（前后左右/上下）；物体抓特征（杯把、壶嘴、车尾）。
            ### 2. 找联系
            同一物体，观测点变→看到的面变。
            ### 3. 试第一条路
            想象自己站在那个位置：杯把在左还是右？
            ### 4. 换路
            连线题：正面/侧面/背面/俯视图分开匹配。
            ### 5. 第二、第三条路
            侧面相似时抓细节：猴脸朝左还是朝右看尾巴。
            ### 6. 归一
            观察三步：定我在哪→看物体哪一面→抓 distinguishing 特征。
            ### 7. 收尾
            易错：没换位想象；两个侧面搞混。
    boundary: ok
  - id: XTY-DY-7420380023871360282
