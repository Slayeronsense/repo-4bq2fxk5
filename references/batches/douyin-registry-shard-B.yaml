    对照:
      安全等级: 绿
      适配动作: []
    题型: [T19]
    方法:
      - 分数桥梁法
      - 数位顺序表
    讲法证据:
      原句摘录: "1米平均分成10份，1份是1分米=1/10米=0.1米；小数是分数的另一种表现形式。"
      adapted_script: |
            ## 学情边界（北师大 4下 · 一_小数的意义和加减法）
            - 主题：小数的意义（长度模型）
            
            ## 讲题脚本
            ### 1. 理信息
            画1米线段均分10份；问1份多长。
            ### 2. 找联系
            1份=1分米=1/10米=0.1米——三种写法同一长度。
            ### 3. 试第一条路
            3份→3分米=3/10米=0.3米；5份→0.5米。
            ### 4. 换路
            1米3分米→1米+0.3米=1.3米（先换同一单位再合）。
            ### 5. 第二、第三条路
            可换元角分情境再探0.1元。
            ### 6. 归一
            十进分数↔一位小数；形式不同意义相同。
            ### 7. 收尾
            易错：只看数字不看单位；没平均分就写小数。
    boundary: ok
