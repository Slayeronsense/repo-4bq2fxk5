    讲法证据:
      原句摘录: "今天这一节课的一个任务就是讲黑板上这道题。我们来看小红面向西北方向，问他的左面是什么方向，它的后面是什么方向。"
      adapted_script: |
        ## 学情边界（北师大 4上 · 五_方向与位置）
        - 主题：面向西北求左右后
        ## 讲题脚本
        ### 1. 理信息
        小红面向西北，求左面、后面各是什么方向；画八方向标（上北下南左西右东）。
        ### 2. 找联系
        问「面向=哪个方向是前面？」→前面是西北；定观测点站在中心。
        ### 3. 试第一条路
        拿实物（小蜜蜂/自己）站在方向标中心，前面朝西北，读左面=西南、后面=东南。
        ### 4. 换路
        改面向东北再练：左=西北、后=西南；验证方法可迁移。
        ### 5. 第二、第三条路
