        - 主题：倒推/还原（开火车图）
        - 适配：删术语/换情境；标注思维拓展
        ## 讲题脚本
        ### 1. 理信息
        某数×3-6÷3+33=39，求原数；顺推式需括号，易错先乘除顺序。
        ### 2. 找联系
        问「知道结果求原来，倒着走？」→倒推/还原；画「开火车」每节一个运算。
        ### 3. 试第一条路
        从39倒推：-33→÷3→+6→÷3，得8；正向验算8×3-6÷3+33=39。
        ### 4. 换路
        开火车格式：? →×3→? →-6→? →÷3→? →+33→39，每站逆运算填数。
        ### 5. 第二、第三条路
        与公交车上下人、年龄逆推类比——结构相同，步骤可增减。
        ### 6. 归一
        「本质一样」——逆运算倒推；火车图防中间推错。
        ### 7. 收尾
        易错：顺推不写括号；倒推漏一步运算。

