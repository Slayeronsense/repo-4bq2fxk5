    讲法证据:
      原句摘录: "大家呼声最高的视频，他又来了。今天我们继续来学习三年级下册第一单元认识东南西北里面的知识。"
      adapted_script: |
        ## 学情边界（北师大 4上 · 五_方向与位置）
        - 主题：给一个方向填其余（转方向标）
        ## 讲题脚本
        ### 1. 理信息
        给出南或西，填其余三方向；复习上北下南左西右东、南北相对、东西相对。
        ### 2. 找联系
        问「方向标会变吗？」→不变；把已知方向转到对应位置再读其余。
        ### 3. 试第一条路
        方法1：站中心想象，右是南则左北、前东、后西。
        ### 4. 换路
        方法2：旋转方向标——给定边是南，把「南」转到该处，读北/东/西。
        ### 5. 第二、第三条路
        西在东位同理；归纳东南西北顺时针排列。
        ### 6. 归一
        「本质一样」——M34-21：定观测点+方向标（转或站中心二选一）。
        ### 7. 收尾
        易错：硬背不画图；左右与前后混淆。

