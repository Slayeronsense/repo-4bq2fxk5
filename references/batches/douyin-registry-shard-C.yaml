  - id: XTY-DY-7314436520901987634
    file: f:/逐字稿/抖音音频逐字稿转完/7314436520901987634.md
    source: douyin
    grade_semester: 3上
    北师大单元: 五_周长
    人教来源提示: 拼图形周长变化
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T07]
    方法:
      - 描边法
      - 减少边
    讲法证据:
      原句摘录: ".大家请看黑板上这道题，老实说我还真的思考了很久。那待会儿呢我就把我的方法呃分享出来，我来抛砖引玉，还请大家多多批评指正。"
      adapted_script: |
        ## 学情边界（北师大 3上 · 五_周长）
        - 主题：拼图形周长（隐藏边/长=4宽）
        ## 讲题脚本
        ### 1. 理信息
        正方形分成4个相等长方形，每个长方形周长10厘米，求原正方形周长；板书「10×4=40」并打叉——中间重叠边不能算两次。
        ### 2. 找联系
        问「一条长等于几条宽？」引导：正方形边=4条宽之和；长方形周长=(长+宽)×2=10，故长+宽=5。
        ### 3. 试第一条路
        学生直接10×4；算不下去点出「只描外圈，中间段不算」。
        ### 4. 换路
        画线段图：宽1份、长4份，长+宽=5对应5份→宽1、长4；边长=4，周长=4×4=16厘米。
        ### 5. 第二、第三条路
        「减少边」法：4块拼合减少6条长，每条长4，周长=原40-6×4=16；与线段图对照。
        ### 6. 归一
        「本质一样」——先找长宽关系，再算外圈或平移成规则图形。
        ### 7. 收尾
        易错：把中间重叠边当周长；强调「描外圈+隐藏信息（长=4宽）」。

    boundary: ok
