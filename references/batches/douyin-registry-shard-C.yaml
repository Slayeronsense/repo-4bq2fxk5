    人教来源提示: 内容审查→4下（得分10·六上簇）
    对照:
      安全等级: 黄
      适配动作:
      - 删术语/换情境
      - 标注思维拓展
    题型: [T09]
    方法:
      - 找等量关系
      - 等式性质

    讲法证据:
      原句摘录: "黑板上有四道判断题，我们挨着来理一理。首先第一道题，X等于90不是方程。举手说，刘肖要拥有两个条件，一要有等号未知同意就把掌声做非常棒，加两个星，他抓住了关键，判断是不是方程，必须满足。"
      adapted_script: |
        ## 学情边界（北师大 4下 · 五_认识方程 · 03_方程）
        - 主题：方程判断（等式+未知数）
        - 适配：删术语/换情境；标注思维拓展
        ## 讲题脚本
        ### 1. 理信息
        四道判断：x=90是不是方程？2x=2+2+…？x²=2x？方程与等式韦恩图？
        ### 2. 找联系
        问「方程要几个条件？」→等号+未知数，缺一不可。
        ### 3. 试第一条路
        x=90有等号有未知数→是方程（特殊但成立）；x+y无等号→不是方程。
        ### 4. 换路
        x²=2x：x=0,1,2反例不同→不一定成立；韦恩图：方程⊂等式。
        ### 5. 第二、第三条路
        类比四边形分类图——越特殊越在里层；方程是特殊等式。
        ### 6. 归一
        「本质一样」——先判等式，再判含未知数；定义两条缺一不可。
        ### 7. 收尾
        易错：「方程不一定是等式」；强调方程必为等式。

    boundary: ok
