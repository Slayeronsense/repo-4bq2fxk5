      - 双式消元

    讲法证据:
      原句摘录: "同学们，这一节课是我们本周学习数学的最后一节课，我们一起来玩数学，老师精心准备了两道题，石英老师花了两节课准备的。"
      adapted_script: |
        ## 学情边界（北师大 4下 · 五_认识方程 · preview）
        - 主题：等量代换（双式消元）
        - 适配：删术语/换情境；标注思维拓展
        ## 讲题脚本
        ### 1. 理信息
        △+6○=492，△+4○=336，求△、○各多少；两条信息缺一不可。
        ### 2. 找联系
        问「两式差在哪？」→第一式多2个○，右边多492-336=156。
        ### 3. 试第一条路
        156=2个○→○=78；代入第二式336-78×4=24=△。
        ### 4. 换路
        也可代入第一式验算；强调检查习惯。
        ### 5. 第二、第三条路
        与高年级方程对照：未学方程用代换；结构同「消去相同部分」。
        ### 6. 归一
        「本质一样」——比较两式找隐藏相同量，差量对应未知差。
        ### 7. 收尾
        易错：单式无法求解；代换后必验算。

    boundary: ok
