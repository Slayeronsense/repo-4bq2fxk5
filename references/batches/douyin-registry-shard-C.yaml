    file: f:/逐字稿/抖音音频逐字稿转完/7315663341907610891.md
    source: douyin
    grade_semester: 3上
    北师大单元: 五_周长
    人教来源提示: 拼图形周长变化
    对照:
      安全等级: 绿
      适配动作:
      []
    题型: [T07]
    方法:
      - 描边法
      - 减少边
    讲法证据:
      原句摘录: "嗨大家最近真的是好冷啊。这两周呢刚好我又在外学习，没等到学校给学生上课。嗯，黑板上这一道题呢是一位学生的家长发给我的，我们一起来学习一下，把两个长是7厘米，宽是2厘米的长方形叠放在一起。"
      adapted_script: |
        ## 学情边界（北师大 3上 · 五_周长）
        - 主题：叠放长方形周长（平移/逐段加）
        ## 讲题脚本
        ### 1. 理信息
        两个7×2长方形叠放，求组合图形周长；描外圈红色边，区分可见边与重叠隐藏边。
        ### 2. 找联系
        问「横着的总长？竖着的总长？」引导：未知段=7-2=5厘米（长减宽）。
        ### 3. 试第一条路
        逐段加：横2+5+7=14，竖7+5+2=14，周长28厘米。
        ### 4. 换路
        平移5厘米横边到上侧，图形变边长7的正方形→7×4=28。
        ### 5. 第二、第三条路
        两种算法对比：逐段加 vs 平移后规则图形，算式形态不同结果同。
        ### 6. 归一
        「本质一样」——周长=外圈长度，平移不改变外圈总长。
        ### 7. 收尾
        易错：重叠段重复计算；关键在求出「5厘米」隐藏边。

    boundary: ok
